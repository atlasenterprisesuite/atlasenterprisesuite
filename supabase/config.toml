# Security-critical Edge Function JWT policy.
# Keep this file aligned with the live Supabase project before any deploy.

[functions.atlas-cloudflare-production-http-verify]
verify_jwt = false

[functions.atlas-creator-e2e-verifier]
verify_jwt = false

[functions.atlas-infra-evidence]
verify_jwt = false

[functions.atlas-local-ai-bootstrap]
verify_jwt = false

[functions.atlas-local-control]
verify_jwt = false

[functions.atlas-infra-status]
verify_jwt = true

[functions.atlas-wireless-mvno]
verify_jwt = true

[functions.atlas-wireless-network]
verify_jwt = true

[functions.atlas-wireless-commissioning]
verify_jwt = true

[functions.atlas-platform-controls]
verify_jwt = true


# Public OAuth callback; the function enforces OAuth state, ATLAS session and RBAC internally.
[functions.atlas-crm-salesforce]
verify_jwt = false

# GitHub Actions OIDC is verified cryptographically by this function.
# Supabase JWT verification cannot validate GitHub-issued OIDC tokens.
[functions.atlas-certificate-ingest]
verify_jwt = false
