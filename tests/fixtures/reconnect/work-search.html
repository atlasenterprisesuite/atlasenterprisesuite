<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Work Search</title></head>
<body>
  <main>
    <h1>Work Search</h1>
    <form aria-label="Work Search Contact">
      <label for="dateOfContact">Date of Contact</label>
      <input id="dateOfContact" name="dateOfContact" />

      <label for="typeOfContact">Type of Contact</label>
      <select id="typeOfContact" name="typeOfContact"><option value="website">Website</option><option value="employer">Employer</option></select>

      <label for="methodOfContact">How did you contact them?</label>
      <select id="methodOfContact" name="methodOfContact"><option value="online">Online</option><option value="email">Email</option></select>

      <label for="employerName">Employer/Agency/Website/Contact Name</label>
      <input id="employerName" name="employerName" />

      <label for="streetAddress">Street Address</label>
      <input id="streetAddress" name="streetAddress" />

      <label for="websiteUrl">Website (URL)</label>
      <input id="websiteUrl" name="websiteUrl" />

      <label for="emailAddress">Email address</label>
      <input id="emailAddress" name="emailAddress" />

      <label for="telephone">Telephone number</label>
      <input id="telephone" name="telephone" />

      <label for="personContacted">Name of person contacted</label>
      <input id="personContacted" name="personContacted" />

      <label for="workType">Type of work you were looking for</label>
      <input id="workType" name="workType" />

      <label for="jobTitle">Job title</label>
      <input id="jobTitle" name="jobTitle" />

      <label for="referenceNumber">Reference number</label>
      <input id="referenceNumber" name="referenceNumber" />

      <label for="result">Result</label>
      <textarea id="result" name="result"></textarea>

      <button id="nextButton" type="button">Next</button>
    </form>
  </main>
</body>
</html>
