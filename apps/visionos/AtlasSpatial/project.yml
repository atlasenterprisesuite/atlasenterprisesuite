name: AtlasSpatial
options:
  bundleIdPrefix: com.atlasenterprisesuite
  deploymentTarget:
    visionOS: "2.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
targets:
  AtlasSpatial:
    type: application
    platform: visionOS
    deploymentTarget: "2.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atlasenterprisesuite.spatial
        PRODUCT_NAME: "ATLAS Spatial"
        TARGETED_DEVICE_FAMILY: "7"
        INFOPLIST_KEY_CFBundleDisplayName: "ATLAS Spatial"
        INFOPLIST_KEY_NSWorldSensingUsageDescription: "ATLAS uses world tracking to place and traverse spatial portals in your surroundings."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    entitlements:
      path: AtlasSpatial.entitlements
  AtlasSpatialTests:
    type: bundle.unit-test
    platform: visionOS
    deploymentTarget: "2.0"
    sources:
      - path: Tests
    dependencies:
      - target: AtlasSpatial
