name: ATLAS Consensus CI

on:
  push:
    branches: ["atlas/integration-consensus-v1"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-consensus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-ux:
    name: Opinion 1 - Product and UX
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Runtime
        run: |
          node --version
          npm --version
      - run: npm ci
      - name: Integration and route contracts
        run: npm run test:integration

  architecture:
    name: Opinion 2 - Architecture and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Runtime
        run: |
          node --version
          npm --version
      - run: npm ci
      - name: TypeScript contract
        run: npm run typecheck
      - name: Production build
        run: npm run build

  security:
    name: Opinion 3 - Security and Reliability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Runtime
        run: |
          node --version
          npm --version
      - name: Locked install + dependency security gate
        run: npm ci --audit --audit-level=high
      - name: Unit tests
        run: npm run test:unit

  postgres-runtime-claim:
    name: PostgreSQL Atomic Claim Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas_runtime_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_runtime_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlas_runtime_ci
    steps:
      - uses: actions/checkout@v4
      - name: Validate atomic runtime claim against isolated PostgreSQL
        run: bash tests/integration/atlas-runtime-postgres-claim.sh

  consensus:
    name: ATLAS 3-of-3 Consensus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [product-ux, architecture, security, postgres-runtime-claim]
    if: ${{ always() }}
    steps:
      - name: Require unanimous consensus
        run: |
          test "${{ needs.product-ux.result }}" = "success"
          test "${{ needs.architecture.result }}" = "success"
          test "${{ needs.security.result }}" = "success"
          test "${{ needs.postgres-runtime-claim.result }}" = "success"
          echo "ATLAS consensus: 4/4 gates approved, including isolated PostgreSQL." >> "$GITHUB_STEP_SUMMARY"
