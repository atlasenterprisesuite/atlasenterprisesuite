name: Hospitality Self-Hosted CI

on:
  push:
    branches:
      - feat/hospitality-room-access
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Runtime
        run: |
          node --version
          npm --version
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Hospitality unit tests
        run: npx vitest run tests/unit/hospitality-room-access.test.ts
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: Production build
        run: npm run build
