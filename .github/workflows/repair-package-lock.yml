name: Repair package lock

on:
  push:
    branches: ["feat/hospitality-os-core"]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[lock-repair]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hospitality-os-core
      - name: Regenerate lock metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile repair
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "atlas-ci"
          git config user.email "atlas-ci@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize npm package lock"
          git push origin HEAD:feat/hospitality-os-core
