name: ATLAS Auto Workspace

on:
  issues:
    types: [opened, edited, reopened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing auto-eligible issue number
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: atlas-auto-workspace-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create governed issue workspace
        uses: actions/github-script@v7
        env:
          MANUAL_ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const issueNumber = context.eventName === 'workflow_dispatch'
              ? Number(process.env.MANUAL_ISSUE_NUMBER)
              : context.issue.number;
            if (!Number.isInteger(issueNumber) || issueNumber < 1) {
              core.setFailed('A valid issue number is required.');
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            if (issue.pull_request || issue.state !== 'open') {
              core.info('Only open issues are eligible.');
              return;
            }

            const body = issue.body || '';
            const readField = (heading) => {
              const escaped = heading.replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&');
              const match = body.match(new RegExp(`### ${escaped}\\s*\\n+([\\s\\S]*?)(?=\\n### |$)`, 'i'));
              if (!match) return '';
              return match[1].replace(/<!--.*?-->/gs, '').trim();
            };
            const slug = (value) => value
              .toLowerCase()
              .normalize('NFKD')
              .replace(/[—–]/g, '-')
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-+|-+$/g, '')
              .slice(0, 45);

            const ownerModule = readField('Owner module');
            const issueType = readField('Issue type');
            const priority = readField('Priority');
            const securitySensitive = readField('Security-sensitive?');
            const productionMutation = readField('Production mutation or deployment required?');
            const priorityMatch = priority.match(/P[0-4]/i);
            const prioritySlug = priorityMatch ? priorityMatch[0].toLowerCase() : '';
            const typeSlug = slug(issueType);
            const moduleSlug = slug(ownerModule);
            const structured = Boolean(moduleSlug && typeSlug && prioritySlug);

            const labelNames = issue.labels.map((label) =>
              typeof label === 'string' ? label : label.name
            ).filter(Boolean);

            const blockedByBody =
              prioritySlug === 'p0' ||
              /^yes$/i.test(securitySensitive) ||
              /^yes$/i.test(productionMutation);
            const blockedByLabels =
              labelNames.includes('review:human-required') ||
              labelNames.includes('security:sensitive') ||
              labelNames.includes('production:mutation') ||
              labelNames.includes('priority:p0');
            const eligibleByBody = structured && !blockedByBody;
            const eligibleByLabel = labelNames.includes('execution:auto-eligible');

            if ((!eligibleByBody && !eligibleByLabel) || blockedByBody || blockedByLabels) {
              core.info('Issue is not eligible for automatic workspace creation.');
              return;
            }

            const implementationTypes = new Set([
              'bug',
              'feature',
              'enhancement',
              'integration',
              'security',
              'infrastructure',
              'data',
              'ux-ui',
              'performance',
              'accessibility',
              'technical-debt',
              'production-incident',
            ]);

            const moduleLabel =
              labelNames.find((name) => name.startsWith('module:')) ||
              `module:${moduleSlug || 'unresolved'}`;
            const typeLabel =
              labelNames.find((name) => name.startsWith('type:')) ||
              `type:${typeSlug || 'unresolved'}`;
            const priorityLabel =
              labelNames.find((name) => name.startsWith('priority:')) ||
              `priority:${prioritySlug || 'unresolved'}`;
            const executor =
              labelNames.includes('agent:codex') || implementationTypes.has(typeSlug)
                ? 'Codex'
                : 'ATLAS Director';

            const branchName = `atlas/issue-${issueNumber}`;
            const markerPath = `.atlas/workspaces/issue-${issueNumber}.md`;
            const marker = '<!-- atlas-auto-workspace -->';

            const { data: repository } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const baseBranch = repository.default_branch;
            const { data: baseRef } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${baseBranch}`,
            });

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branchName}`,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/heads/${branchName}`,
                sha: baseRef.object.sha,
              });
            }

            const workspaceBody = [
              '# ATLAS Governed Issue Workspace',
              '',
              `Issue: #${issueNumber} — ${issue.title}`,
              `Module: ${moduleLabel.replace('module:', '')}`,
              `Type: ${typeLabel.replace('type:', '')}`,
              `Priority: ${priorityLabel.replace('priority:', '').toUpperCase()}`,
              'Orchestrator: ATLAS Director',
              `Executor: ${executor}`,
              '',
              'This file establishes an isolated implementation workspace. It does not claim the issue is implemented.',
              '',
              '## Required completion evidence',
              '- Acceptance criteria satisfied',
              '- Relevant tests added or updated',
              '- Typecheck/test/build gates green',
              '- Security and tenant isolation preserved',
              '- Production verification required separately when applicable',
              '',
              `Source issue: #${issueNumber}`,
            ].join('\n');

            let existingFile;
            try {
              existingFile = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: markerPath,
                ref: branchName,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (!existingFile) {
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: markerPath,
                branch: branchName,
                message: `chore(atlas): initialize workspace for issue #${issueNumber}`,
                content: Buffer.from(workspaceBody).toString('base64'),
              });
            }

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branchName}`,
              per_page: 100,
            });

            let pull = openPulls[0];
            if (!pull) {
              const created = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: branchName,
                base: baseBranch,
                draft: true,
                title: `[ATLAS] #${issueNumber} ${issue.title}`,
                body: [
                  `Closes #${issueNumber}`,
                  '',
                  'Governed implementation workspace created automatically from an eligible ATLAS issue.',
                  '',
                  `- Module: ${moduleLabel}`,
                  `- Type: ${typeLabel}`,
                  `- Priority: ${priorityLabel}`,
                  '- Orchestrator: ATLAS Director',
                  `- Executor: ${executor}`,
                  '',
                  'This draft PR is a workspace, not completion evidence. Keep it draft until acceptance criteria and CI verification are satisfied.',
                ].join('\n'),
              });
              pull = created.data;
            }

            const workspaceLabel = 'workspace:auto-created';
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: workspaceLabel,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: workspaceLabel,
                color: '1a7f37',
                description: 'ATLAS created an isolated implementation branch and draft PR.',
              });
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: [workspaceLabel],
            });

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const commentBody = [
              marker,
              '## ATLAS Auto Workspace',
              '',
              `- **Branch:** \`${branchName}\``,
              `- **Draft PR:** #${pull.number}`,
              '- **State:** implementation workspace ready',
              '',
              'The PR remains draft until implementation, tests, review gates, and any required production verification are complete.',
            ].join('\n');
            const prior = comments.find((comment) =>
              typeof comment.body === 'string' && comment.body.includes(marker)
            );
            if (prior) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prior.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: commentBody,
              });
            }

            core.summary
              .addHeading('ATLAS Auto Workspace')
              .addRaw(`Issue #${issueNumber} → ${branchName} → draft PR #${pull.number}`)
              .write();
