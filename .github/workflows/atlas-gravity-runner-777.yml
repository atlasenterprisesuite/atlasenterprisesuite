name: ATLAS Gravity Runner 777 (Read-only P0)
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read
concurrency:
  group: atlas-gravity-runner-777
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout for isolated negative tests
        uses: actions/checkout@v4
      - name: Execute negative evidence tests
        run: node --test tests/executor/gravity-runner-777.test.mjs
      - name: Inspect effective required checks with exact SHA (fail closed)
        shell: bash
        run: node scripts/gravity-runner-777.mjs
      - name: Publish inspectable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-gravity-p0-ledger
          path: evidence/
          if-no-files-found: error
          retention-days: 7
