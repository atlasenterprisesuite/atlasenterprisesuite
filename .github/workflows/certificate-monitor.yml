name: ATLAS Certificate Monitor
on:
  schedule:
    - cron: '20 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: atlas-certificate-monitor
  cancel-in-progress: false

jobs:
  observe-public-tls:
    # Fail-closed: Supabase has reached its Edge Function quota, so the dedicated
    # OIDC receiver is not deployed. Keep scheduled invocations non-operational
    # until the validated receiver is active and verified end-to-end.
    if: ${{ vars.ATLAS_CERT_MONITOR_INGEST_READY == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted workflow
        uses: actions/checkout@v4
      - name: Run allowlisted TLS probe and authenticated evidence upload
        env:
          ATLAS_CERTIFICATE_INGEST_URL: https://ggmanzcgtlrvqfoccgsh.supabase.co/functions/v1/atlas-certificate-ingest
        run: node tools/certificate-monitor/probe.mjs
