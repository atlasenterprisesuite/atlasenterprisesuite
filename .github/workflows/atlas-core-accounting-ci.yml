name: ATLAS Core + Accounting CI

on:
  push:
    branches: ["feat/atlas-health-core-prereq-20260904"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  core-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
