name: ATLAS People CI

on:
  push:
    branches:
      - release/atlas-a-z
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  people:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: People unit tests
        run: npm test -- tests/unit/people-employee.test.ts tests/unit/people-time.test.ts tests/unit/people-payroll.test.ts

      - name: People repository tests
        run: npm test -- tests/integration/people-repository.test.ts

      - name: People Time UI tests
        run: npm test -- tests/integration/people-time-ui.test.tsx

      - name: People Payroll UI tests
        run: npm test -- tests/integration/people-payroll-ui.test.tsx

      - name: People route tests
        run: npm test -- tests/integration/people-routes.test.tsx

      - name: Runtime truth-state safety scan
        run: |
          if grep -R -nE 'tenant-demo|org-demo|Demo environment|Tax filing: Connected|Payment rail: Connected|Tax filing: Filed|Payment rail: Paid' apps/web/src/modules/people packages/people/src 2>/dev/null; then
            echo "People runtime contains a forbidden demo/provider claim"
            exit 1
          fi
          if grep -R -nE '(ssn|social_security_number|bank_account_number|routing_number|sk_live_|service_role)' apps/web/src/modules/people packages/people/src 2>/dev/null; then
            echo "People runtime contains a forbidden sensitive credential/identifier pattern"
            exit 1
          fi

      - name: Build
        run: npm run build
