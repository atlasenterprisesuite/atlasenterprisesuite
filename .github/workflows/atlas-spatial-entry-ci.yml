name: ATLAS Spatial Entry CI

on:
  push:
    branches:
      - atlas/spatial-entry-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit and integration tests
        run: npm test -- --run
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
