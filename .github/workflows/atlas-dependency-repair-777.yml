name: ATLAS Dependency Repair 777
on:
  push:
    branches:
      - fix/atlas-dependencies-777
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reinstall exact lockfile
        run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Install FFmpeg for native video tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak
          ffmpeg -version
          command -v espeak
          espeak --version
      - name: Verify full suite
        run: npm run verify:all
