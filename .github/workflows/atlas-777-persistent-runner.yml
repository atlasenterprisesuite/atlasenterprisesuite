name: ATLAS 777 Persistent Runner
on:
  workflow_dispatch:
    inputs:
      module:
        description: Module identifier (safe slug)
        required: true
        type: string
      dry_run:
        description: Inventory and validate without deploying
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: atlas-777-${{ inputs.module || 'scheduled-audit' }}
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate module and prepare phase ledger
        env:
          ATLAS_MODULE: ${{ inputs.module || 'global' }}
        run: node scripts/atlas-777-runner.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run existing unit tests
        run: npm run test:unit
      - name: Run existing integration tests
        run: npm run test:integration
      - name: Verify types
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-777-evidence-${{ github.run_id }}
          path: artifacts/atlas-777/
          if-no-files-found: error
          retention-days: 30
