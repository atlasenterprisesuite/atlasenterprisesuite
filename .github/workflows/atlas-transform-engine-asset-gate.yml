name: ATLAS Transform Engine Verified Sprite Gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/modules/creator/director/motion/transform/**'
      - 'apps/web/public/atlas/transform/**'
      - 'docs/creator/ATLAS_TRANSFORM_ENGINE_ASSET_MANIFEST.json'
      - 'scripts/creator/verify-transform-sprite.mjs'
      - 'scripts/creator/png-integrity.mjs'
      - 'tests/creator/png-integrity.test.mjs'
      - 'scripts/creator/verify-transform-review.mjs'
      - '.github/workflows/atlas-transform-engine-asset-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  verify-sprite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test PNG decoder with valid and adversarial fixtures
        run: node --test tests/creator/png-integrity.test.mjs
      - name: Verify image structure and SHA fail-closed
        run: node scripts/creator/verify-transform-sprite.mjs
      - name: Verify independent GitHub approval, permissions and exact HEAD
        env:
          GH_TOKEN: ${{ github.token }}
          ATLAS_PR_NUMBER: ${{ github.event.pull_request.number }}
          ATLAS_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ATLAS_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node scripts/creator/verify-transform-review.mjs
