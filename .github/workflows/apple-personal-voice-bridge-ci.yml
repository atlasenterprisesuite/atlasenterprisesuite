name: Apple Personal Voice Bridge CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - "native/apple-personal-voice-bridge/**"
      - ".github/workflows/apple-personal-voice-bridge-ci.yml"
  push:
    branches: ["main"]
    paths:
      - "native/apple-personal-voice-bridge/**"
      - ".github/workflows/apple-personal-voice-bridge-ci.yml"

permissions:
  contents: read

jobs:
  native-verify:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: native/apple-personal-voice-bridge
    steps:
      - uses: actions/checkout@v4
      - name: Swift runtime
        run: swift --version
      - name: macOS tests
        run: swift test
      - name: macOS build
        run: swift build
      - name: iOS SDK compile
        run: xcodebuild -scheme AtlasAppleVoiceBridge -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/xcode-ios CODE_SIGNING_ALLOWED=NO build
