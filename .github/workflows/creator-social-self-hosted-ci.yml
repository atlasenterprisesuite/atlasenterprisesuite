name: Creator Social Self-Hosted CI

on:
  push:
    branches:
      - feat/creator-social-copilot

permissions:
  contents: read

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Runtime
        run: |
          node --version
          npm --version
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Social unit tests
        run: npx vitest run tests/unit/social-platforms.test.ts tests/unit/social-analytics.test.ts tests/unit/social-drafting.test.ts
      - name: Social integration tests
        run: npx vitest run tests/integration/atlas-social-copilot-route.test.tsx tests/integration/atlas-creator-route.test.tsx
      - name: Full unit suite
        run: npm run test:unit
      - name: Full integration suite
        run: npm run test:integration
      - name: Production build
        run: npm run build
