name: ATLAS Security Lock Sync

on:
  push:
    branches:
      - feat/atlas-device-account-protection
    paths:
      - .github/workflows/atlas-security-lock-sync.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/atlas-device-account-protection
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronize npm workspace lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "ATLAS CI"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync security protection workspace lockfile"
          git push origin HEAD:feat/atlas-device-account-protection
