name: Bible OS Jesus Evidence CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/modules/knowledge/bible/**'
      - 'tests/integration/jesus-*.test.ts'
      - 'tests/integration/atlas-identity-route.test.tsx'
      - 'scripts/e2e/bible-os-jesus-axe.mjs'
      - 'tests/integration/bible-os-jesus-accessibility.test.tsx'
      - 'tests/integration/bible-os-functional-p0.test.ts'
      - '.github/workflows/bible-os-jesus-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bible-os-jesus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate isolated browser Axe script syntax
        run: node --check scripts/e2e/bible-os-jesus-axe.mjs
      - name: Evidence and UI integration tests
        run: npx vitest run tests/integration/jesus-teachings-evidence.test.ts tests/integration/jesus-timeline-ui.test.ts tests/integration/jesus-evidence-negative.test.ts tests/integration/bible-os-jesus-accessibility.test.tsx tests/integration/bible-os-functional-p0.test.ts tests/integration/atlas-identity-route.test.tsx
      - name: Typecheck
        run: npm run typecheck
      - name: Production build (isolated E2E backend; no deploy)
        env:
          VITE_SUPABASE_URL: https://atlas-bible-e2e.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: atlas-browser-e2e-only
        run: npm run build
      - name: Authenticated browser Axe on the real Jesus panel (isolated)
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.64.1 axe-core@4.14.0
          npx playwright install --with-deps chromium
          (cd apps/web && npx vite preview --host 127.0.0.1 --port 4173 --strictPort) > /tmp/atlas-bible-e2e-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --noproxy '*' -fsS http://127.0.0.1:4173/ > /dev/null; then
              node scripts/e2e/bible-os-jesus-axe.mjs
              exit 0
            fi
            sleep 1
          done
          cat /tmp/atlas-bible-e2e-preview.log
          exit 1
      - name: Upload isolated preview logs if browser gate fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-bible-jesus-axe-preview-log
          path: /tmp/atlas-bible-e2e-preview.log
          if-no-files-found: ignore
