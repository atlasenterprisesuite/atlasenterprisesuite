name: Bible OS Jesus Evidence CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/modules/knowledge/bible/**'
      - 'tests/integration/jesus-*.test.ts'
      - 'tests/integration/bible-os-functional-p0.test.ts'
      - '.github/workflows/bible-os-jesus-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bible-os-jesus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Evidence and UI integration tests
        run: npx vitest run tests/integration/jesus-teachings-evidence.test.ts tests/integration/jesus-timeline-ui.test.ts tests/integration/jesus-evidence-negative.test.ts tests/integration/bible-os-jesus-accessibility.test.tsx tests/integration/bible-os-functional-p0.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Production build (no deploy)
        run: npm run build
