name: Cloudflare MCP security gate
on:
  pull_request:
    paths:
      - "packages/cloudflare-mcp/**"
      - "tests/unit/cloudflare-mcp-security.test.mjs"
      - ".github/workflows/cloudflare-mcp-security.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Cloudflare MCP negative tests
        run: node --test tests/unit/cloudflare-mcp-security.test.mjs
