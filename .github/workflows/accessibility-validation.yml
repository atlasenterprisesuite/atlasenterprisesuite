name: ATLAS Accessibility Validation

on:
  pull_request:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - "data/accessibility/**"
      - "tests/**accessibility**"
      - "tests/unit/sign-language-registry.test.ts"
      - "docs/validation/**"
      - "scripts/verify-accounting-reconciliation-browser.mjs"
      - "scripts/verify-chronos-browser.mjs"
      - ".github/workflows/accessibility-validation.yml"
  push:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - "data/accessibility/**"
      - "tests/**accessibility**"
      - "tests/unit/sign-language-registry.test.ts"
      - "docs/validation/**"
      - "scripts/verify-accounting-reconciliation-browser.mjs"
      - "scripts/verify-chronos-browser.mjs"
      - ".github/workflows/accessibility-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-accessibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automated-a11y:
    name: WCAG 2.2 AA automated gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript and production build
        run: |
          npm run typecheck
          npm run build
      - name: Start production preview
        run: |
          cd apps/web
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/atlas-accessibility-preview.log 2>&1 &
          echo $! > /tmp/atlas-accessibility-preview.pid
      - name: Wait for preview
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/atlas-accessibility-preview.log
          exit 1
      - name: Install synchronized browser driver
        run: npx --yes browser-driver-manager install chrome
      - name: Axe WCAG A and AA plus best-practice scan
        shell: bash
        run: |
          routes=(
            "/"
            "/finance"
            "/finance/accounting/reconciliation"
            "/health"
            "/settings/accessibility/communication"
            "/chronos"
            "/chronos/explore"
            "/chronos/research/01.001"
            "/chronos/evidence"
            "/chronos/timeline"
            "/chronos/review"
          )
          for route in "${routes[@]}"; do
            echo "Auditing ${route}"
            npx --yes @axe-core/cli@4.13.0 \
              "http://127.0.0.1:4173${route}" \
              --tags wcag2a,wcag2aa,wcag21a,wcag21aa,wcag22a,wcag22aa,best-practice \
              --chrome-options="no-sandbox,disable-setuid-sandbox,disable-dev-shm-usage" \
              --exit \
              --verbose
          done
      - name: Focused accessibility tests
        run: >-
          npx vitest run
          tests/unit/chronos-navigation.test.tsx
          tests/unit/chronos-os.test.ts
          tests/unit/accessibility-confidence.test.ts
          tests/unit/accessibility-profile.test.ts
          tests/unit/accessibility-device-capabilities.test.ts
          tests/unit/sign-language-registry.test.ts
          tests/integration/atlas-accessibility-shell.test.tsx
          tests/integration/accessibility-settings-route.test.tsx
          tests/integration/accessibility-validation-contract.test.ts
      - name: Install isolated browser verification tooling
        run: npm install --prefix /tmp/atlas-reconciliation-browser --no-save --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - name: Reconciliation import, export and responsive browser verification
        env:
          ATLAS_PLAYWRIGHT_MODULE: /tmp/atlas-reconciliation-browser/node_modules/playwright/index.mjs
          ATLAS_RECONCILIATION_BASE_URL: http://127.0.0.1:4173
        run: node scripts/verify-accounting-reconciliation-browser.mjs
      - name: CHRONOS navigation and responsive browser verification
        env:
          ATLAS_PLAYWRIGHT_MODULE: /tmp/atlas-reconciliation-browser/node_modules/playwright/index.mjs
          ATLAS_CHRONOS_BASE_URL: http://127.0.0.1:4173
        run: node scripts/verify-chronos-browser.mjs
      - name: Upload CHRONOS browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-chronos-browser-evidence
          path: .tmp/chronos-browser/
          if-no-files-found: ignore
      - name: Upload reconciliation browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-reconciliation-browser-evidence
          path: .tmp/accounting-reconciliation-browser/
          if-no-files-found: ignore
      - name: Verify exact CHRONOS PR head
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/chronos')
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_HEAD"
          integration_sha="$(git rev-parse HEAD)"
          git fetch --no-tags --depth=1 origin "$EXPECTED_HEAD"
          git checkout --detach FETCH_HEAD
          trap 'git checkout --detach "$integration_sha"' EXIT
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "CHRONOS exact head: $(git rev-parse HEAD)"
          npm run typecheck
          npx vitest run tests/unit/chronos-navigation.test.tsx tests/unit/chronos-os.test.ts
      - name: Upload preview log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-accessibility-preview-log
          path: /tmp/atlas-accessibility-preview.log
          if-no-files-found: ignore
