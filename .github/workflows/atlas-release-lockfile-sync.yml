name: ATLAS Release Lockfile Sync

on:
  push:
    branches:
      - release/atlas-a-z
    paths:
      - package.json
      - apps/web/package.json
      - packages/*/package.json
      - .github/workflows/atlas-release-lockfile-sync.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/atlas-a-z

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate reproducible lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized."
            exit 0
          fi
          git config user.name "ATLAS Release Bot"
          git config user.email "atlashealthfrontiers@gmail.com"
          git add package-lock.json
          git commit -m "build: synchronize A-Z release lockfile"
          git push origin HEAD:release/atlas-a-z
