name: ATLAS Direct Isolated Cloudflare Preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/modules/connect/AtlasDirectCallPage.tsx'
      - 'apps/web/src/modules/connect/atlas-direct-call.css'
      - 'apps/web/src/lib/directCallSignaling.ts'
      - 'apps/web/direct-preview.html'
      - 'apps/web/src/direct-preview.tsx'
      - 'apps/web/vite.direct-preview.config.ts'
      - 'worker/direct-preview-entry.ts'
      - 'wrangler.direct-preview.jsonc'
      - '.github/workflows/atlas-direct-preview.yml'

permissions:
  contents: read

concurrency:
  group: atlas-direct-cloudflare-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-direct-preview:
    if: >-
      github.event.pull_request.number == 1050 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/atlas-direct-webrtc-calling-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies with no deploy credentials
        run: npm ci

      - name: Build isolated voice-only HTML and verify source SHA
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/vite build --config apps/web/vite.direct-preview.config.ts
          test -s dist-direct-preview/direct-preview.html
          test -n "$(find dist-direct-preview/assets -name '*.js' -print -quit)"
          printf '%s' "$(git rev-parse HEAD)" > dist-direct-preview/source-sha.txt
          echo "Preview compiled from exact source SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Cloudflare preview provider preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN GitHub Actions secret. Preview remains unmodified."
            exit 1
          fi
          echo "Provider token present; no production deployment command will execute." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload isolated Cloudflare Preview (no production deployment)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.135.0 preview --config wrangler.direct-preview.jsonc --name atlas-direct-1050 --json             | tee /tmp/atlas-direct-preview.json
          node -e "const fs=require('fs');const s=fs.readFileSync('/tmp/atlas-direct-preview.json','utf8');const p=JSON.parse(s);const v=JSON.stringify(p);if(!v.includes('workers.dev'))process.exit(2);console.log('Preview deployment response received');"
          URL="$(node -e "const fs=require('fs');const s=fs.readFileSync('/tmp/atlas-direct-preview.json','utf8');const m=s.match(/https:\/\/[a-zA-Z0-9.-]+\.workers\.dev/);if(!m)process.exit(2);process.stdout.write(m[0])")"
          echo "ATLAS_DIRECT_PREVIEW_URL=$URL" >> "$GITHUB_ENV"
          echo "Preview: $URL/connect/direct" >> "$GITHUB_STEP_SUMMARY"
          echo "Source SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify HTTPS preview exact-SHA and access boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ATLAS_DIRECT_PREVIEW_URL:-}"
          test "$(curl -L --silent --show-error --max-time 30 -o /tmp/direct-voice.html -w '%{http_code}' "$ATLAS_DIRECT_PREVIEW_URL/connect/direct")" = "200"
          grep -q 'ATLAS Direct Voice' /tmp/direct-voice.html
          test "$(curl -L --silent --show-error --max-time 30 -o /tmp/direct-sha.txt -w '%{http_code}' "$ATLAS_DIRECT_PREVIEW_URL/source-sha.txt")" = "200"
          test "$(cat /tmp/direct-sha.txt)" = "$(git rev-parse HEAD)"
          test "$(curl -L --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' "$ATLAS_DIRECT_PREVIEW_URL/finance")" = "404"
          echo "Isolated HTTPS preview verified for SHA $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Note: live iPhone-Windows microphone/audio E2E remains a separate P0 gate." >> "$GITHUB_STEP_SUMMARY"
