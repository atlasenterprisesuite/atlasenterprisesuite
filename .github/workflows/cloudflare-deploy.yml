name: ATLAS Cloudflare Worker Deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "data/**"
      - "supabase/functions/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-deploy.yml"

concurrency:
  group: atlas-cloudflare-worker
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  id-token: write

jobs:
  validate-deploy-verify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Security gate
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Production build
        run: npm run build

      - name: Select Cloudflare deployment verification mode
        id: deployment_mode
        env:
          TOKEN_SECRET_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          TOKEN_VARIABLE_PRESENT: ${{ vars.CLOUDFLARE_API_TOKEN != '' }}
          ACCOUNT_SECRET_PRESENT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          ACCOUNT_VARIABLE_PRESENT: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -euo pipefail
          echo "Cloudflare API token secret configured: $TOKEN_SECRET_PRESENT"
          echo "Cloudflare API token variable configured: $TOKEN_VARIABLE_PRESENT"
          echo "Cloudflare account ID secret configured: $ACCOUNT_SECRET_PRESENT"
          echo "Cloudflare account ID variable configured: $ACCOUNT_VARIABLE_PRESENT"

          if [ "$TOKEN_VARIABLE_PRESENT" = "true" ] && [ "$TOKEN_SECRET_PRESENT" != "true" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN must never be stored as an Actions Variable; use an Actions Secret."
            exit 1
          fi

          if [ "$TOKEN_SECRET_PRESENT" = "true" ] && { [ "$ACCOUNT_SECRET_PRESENT" = "true" ] || [ "$ACCOUNT_VARIABLE_PRESENT" = "true" ]; }; then
            MODE="direct-wrangler"
          else
            MODE="cloudflare-native-github-app"
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Cloudflare deployment verification mode: $MODE" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate direct Cloudflare authorization
        if: steps.deployment_mode.outputs.mode == 'direct-wrangler'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured as an Actions Secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured as an Actions Secret or Variable"; exit 1; }

      - name: Resolve Cloudflare account ID
        if: steps.deployment_mode.outputs.mode == 'direct-wrangler'
        id: cloudflare_account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONFIGURED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ACCOUNTS_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts?per_page=50")"

          RESOLVED_ACCOUNT_ID="$(printf '%s' "$ACCOUNTS_JSON" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d).on("end",()=>{
              const j=JSON.parse(s);
              if (!j.success) process.exit(2);
              const accounts=Array.isArray(j.result)?j.result:[];
              const configured=process.env.CONFIGURED_ACCOUNT_ID;
              const match=accounts.find(a=>a && a.id===configured);
              if (match) {
                process.stdout.write(match.id);
                return;
              }
              if (accounts.length===1 && accounts[0] && accounts[0].id) {
                process.stdout.write(accounts[0].id);
                return;
              }
              process.exit(3);
            });
          ')" || {
            STATUS=$?
            if [ "$STATUS" = "3" ]; then
              echo "::error::Expected exactly one accessible Cloudflare account when the configured account ID is invalid"
            else
              echo "::error::Unable to resolve a Cloudflare account from the configured API token"
            fi
            exit 1
          }

          test -n "$RESOLVED_ACCOUNT_ID" || { echo "::error::Cloudflare account resolution returned an empty ID"; exit 1; }
          echo "::add-mask::$RESOLVED_ACCOUNT_ID"
          echo "account_id=$RESOLVED_ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy Workers Static Assets
        if: steps.deployment_mode.outputs.mode == 'direct-wrangler'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare_account.outputs.account_id }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.jsonc 2>&1 | tee /tmp/wrangler-deploy.log
          DEPLOYMENT_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -n 1 || true)"
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "::error::Wrangler did not report a workers.dev deployment URL"
            exit 1
          fi
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Cloudflare deployment URL: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Cloudflare worker artifact
        if: steps.deployment_mode.outputs.mode == 'direct-wrangler'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          ROOT_STATUS="$(curl --retry 5 --retry-delay 3 --silent --show-error --output /dev/null --write-out '%{http_code}' "$DEPLOYMENT_URL/")"
          SPA_STATUS="$(curl --retry 5 --retry-delay 3 --silent --show-error --output /dev/null --write-out '%{http_code}' "$DEPLOYMENT_URL/finance/accounting/accounts-payable")"
          HEALTH_STATUS="$(curl --retry 5 --retry-delay 3 --silent --show-error --output /dev/null --write-out '%{http_code}' "$DEPLOYMENT_URL/healthz")"

          test "$ROOT_STATUS" = "401" || { echo "::error::Expected anonymous root request to be denied with 401, got $ROOT_STATUS"; exit 1; }
          test "$SPA_STATUS" = "401" || { echo "::error::Expected anonymous SPA request to be denied with 401, got $SPA_STATUS"; exit 1; }
          test "$HEALTH_STATUS" = "401" || { echo "::error::Expected anonymous health request to be denied with 401, got $HEALTH_STATUS"; exit 1; }

          echo "Access gateway smoke verification passed." >> "$GITHUB_STEP_SUMMARY"
          echo "Anonymous root, SPA route, and healthz requests were denied with 401 as expected." >> "$GITHUB_STEP_SUMMARY"
          echo "Authenticated asset delivery is covered by the RS256 Access gateway contract tests." >> "$GITHUB_STEP_SUMMARY"
          echo "Custom-domain cutover remains a separate production gate." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify official Cloudflare Workers GitHub App deployment
        if: steps.deployment_mode.outputs.mode == 'cloudflare-native-github-app'
        id: native
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECK_NAME: "Workers Builds: atlas-enterprise-suite-web"
        run: |
          set -euo pipefail
          API_URL="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs"
          CHECK_JSON=""

          for ATTEMPT in $(seq 1 60); do
            RESPONSE="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API_URL")"

            CHECK_JSON="$(printf '%s' "$RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const c=(j.check_runs||[]).find(x=>x.name===process.env.CHECK_NAME&&x.app&&x.app.slug==='cloudflare-workers-and-pages');if(c)process.stdout.write(JSON.stringify(c));})")"

            if [ -z "$CHECK_JSON" ]; then
              echo "Waiting for official Cloudflare check run ($ATTEMPT/60)..."
              sleep 5
              continue
            fi

            CHECK_STATUS="$(printf '%s' "$CHECK_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String(JSON.parse(s).status||'')))")"
            CHECK_CONCLUSION="$(printf '%s' "$CHECK_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String(JSON.parse(s).conclusion||'')))")"

            if [ "$CHECK_STATUS" != "completed" ]; then
              echo "Official Cloudflare check is $CHECK_STATUS ($ATTEMPT/60)..."
              sleep 5
              continue
            fi

            if [ "$CHECK_CONCLUSION" != "success" ]; then
              echo "::error::Official Cloudflare Workers GitHub App deployment concluded $CHECK_CONCLUSION for $GITHUB_SHA"
              exit 1
            fi

            break
          done

          test -n "$CHECK_JSON" || { echo "::error::Official Cloudflare Workers GitHub App check was not found for $GITHUB_SHA"; exit 1; }

          CHECK_STATUS="$(printf '%s' "$CHECK_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String(JSON.parse(s).status||'')))")"
          CHECK_CONCLUSION="$(printf '%s' "$CHECK_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String(JSON.parse(s).conclusion||'')))")"
          test "$CHECK_STATUS" = "completed" || { echo "::error::Official Cloudflare check did not complete before timeout"; exit 1; }
          test "$CHECK_CONCLUSION" = "success" || { echo "::error::Official Cloudflare check is not successful"; exit 1; }

          CHECK_ID="$(printf '%s' "$CHECK_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String(JSON.parse(s).id||'')))")"
          DETAILS_URL="$(printf '%s' "$CHECK_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String(JSON.parse(s).details_url||'')))")"
          SUMMARY="$(printf '%s' "$CHECK_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String((JSON.parse(s).output||{}).summary||'')))")"
          VERSION_ID="$(printf '%s' "$SUMMARY" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const m=s.match(/Version ID:\s*([A-Za-z0-9-]+)/);if(m)process.stdout.write(m[1]);})")"
          BUILD_ID="$(printf '%s' "$SUMMARY" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const m=s.match(/Build ID:\s*\[?([A-Za-z0-9-]+)\]?/);if(m)process.stdout.write(m[1]);})")"

          test -n "$CHECK_ID" || { echo "::error::Official Cloudflare check id is missing"; exit 1; }
          test -n "$VERSION_ID" || { echo "::error::Official Cloudflare Version ID is missing from the provider check"; exit 1; }

          echo "check_id=$CHECK_ID" >> "$GITHUB_OUTPUT"
          echo "details_url=$DETAILS_URL" >> "$GITHUB_OUTPUT"
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "cloudflare_native_build_verified=true" >> "$GITHUB_OUTPUT"
          echo "Official Cloudflare Workers GitHub App deployment verified for $GITHUB_SHA (Version $VERSION_ID)." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production Cloudflare Access perimeter
        if: steps.deployment_mode.outputs.mode == 'cloudflare-native-github-app'
        id: native_edge
        env:
          PRODUCTION_URL: https://www.atlasenterprisesuite.com
        run: |
          set -euo pipefail
          ROOT_STATUS="$(curl --silent --show-error --max-redirs 0 --output /dev/null --dump-header /tmp/atlas-access-headers.txt --write-out '%{http_code}' "$PRODUCTION_URL/" || true)"
          LOCATION="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/,"");sub(/\r$/,"");print;exit}' /tmp/atlas-access-headers.txt)"
          SERVER_HEADER="$(awk 'BEGIN{IGNORECASE=1} /^server:/{sub(/^[^:]+:[[:space:]]*/,"");sub(/\r$/,"");print;exit}' /tmp/atlas-access-headers.txt)"

          case "$ROOT_STATUS" in
            302|303)
              case "$LOCATION" in
                https://winder-aranguren.cloudflareaccess.com/cdn-cgi/access/login/*) ;;
                *) echo "::error::Production redirect did not target the expected Cloudflare Access login"; exit 1 ;;
              esac
              ;;
            401|403)
              # Provider provenance for a direct denial must include: server: cloudflare
              test "$(printf '%s' "$SERVER_HEADER" | tr '[:upper:]' '[:lower:]')" = "cloudflare" || { echo "::error::Fail-closed response was not identified as Cloudflare"; exit 1; }
              ;;
            *)
              echo "::error::Expected fail-closed Cloudflare perimeter response (302/303/401/403), got HTTP $ROOT_STATUS"
              exit 1
              ;;
          esac

          echo "access_enforced=true" >> "$GITHUB_OUTPUT"
          echo "Cloudflare production perimeter fails closed." >> "$GITHUB_STEP_SUMMARY"
          echo "Anonymous production request returned HTTP $ROOT_STATUS." >> "$GITHUB_STEP_SUMMARY"

      - name: Record Cloudflare deployment evidence in ATLAS Manager
        env:
          DEPLOYMENT_MODE: ${{ steps.deployment_mode.outputs.mode }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          NATIVE_CHECK_ID: ${{ steps.native.outputs.check_id }}
          NATIVE_DETAILS_URL: ${{ steps.native.outputs.details_url }}
          NATIVE_VERSION_ID: ${{ steps.native.outputs.version_id }}
          NATIVE_BUILD_ID: ${{ steps.native.outputs.build_id }}
          NATIVE_VERIFIED: ${{ steps.native.outputs.cloudflare_native_build_verified }}
          CUSTOM_DOMAIN_ACCESS_ENFORCED: ${{ steps.native_edge.outputs.access_enforced }}
        run: |
          set -euo pipefail
          DEPLOYMENT_PROBE="$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('apps/web/public/deployment.json','utf8'));process.stdout.write(String(j.deployment_probe||''))")"
          test -n "$DEPLOYMENT_PROBE" || { echo "::error::deployment.json does not contain deployment_probe"; exit 1; }
          export DEPLOYMENT_PROBE

          OIDC_RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=atlas-infrastructure-evidence")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value||''))")"
          test -n "$OIDC_TOKEN" || { echo "::error::GitHub OIDC token was not issued"; exit 1; }

          if [ "$DEPLOYMENT_MODE" = "direct-wrangler" ]; then
            EVIDENCE_JSON="$(node -e "console.log(JSON.stringify({provider:'cloudflare',status:'passed',verification_type:'infrastructure-deployment',target_service:'atlas-enterprise-suite-web',target_version:process.env.GITHUB_SHA,provider_state:'verified',storage_state:'configured',checks:{workers_dev_reachable:true,access_gateway_fail_closed:true,anonymous_root_denied:true,anonymous_spa_route_denied:true,anonymous_healthz_denied:true,deployment_probe:process.env.DEPLOYMENT_PROBE},metadata:{deployment_mode:'direct-wrangler',deployment_url:process.env.DEPLOYMENT_URL,anonymous_expected_status:401,production_domain_cutover:false}}))")"
          else
            test "$NATIVE_VERIFIED" = "true" || { echo "::error::Native Cloudflare deployment was not verified"; exit 1; }
            test "$CUSTOM_DOMAIN_ACCESS_ENFORCED" = "true" || { echo "::error::Production Cloudflare Access perimeter was not verified"; exit 1; }
            EVIDENCE_JSON="$(node -e "console.log(JSON.stringify({provider:'cloudflare',status:'passed',verification_type:'infrastructure-deployment',target_service:'atlas-enterprise-suite-web',target_version:process.env.GITHUB_SHA,provider_state:'verified',storage_state:'configured',checks:{cloudflare_native_build_verified:true,cloudflare_check_run_id:process.env.NATIVE_CHECK_ID,cloudflare_version_id:process.env.NATIVE_VERSION_ID,cloudflare_build_id:process.env.NATIVE_BUILD_ID||null,custom_domain_access_enforced:true,worker_access_contract_tested:true,deployment_probe:process.env.DEPLOYMENT_PROBE},metadata:{deployment_mode:'cloudflare-native-github-app',provider_check_details_url:process.env.NATIVE_DETAILS_URL,production_domain:'https://www.atlasenterprisesuite.com',evidence_semantics:'official_provider_check_plus_oidc_plus_access_perimeter'}}))")"
          fi

          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            "https://ggmanzcgtlrvqfoccgsh.supabase.co/functions/v1/atlas-infra-evidence?api=record" \
            --data "$EVIDENCE_JSON" \
            > /tmp/atlas-infra-evidence.json

          echo "Cloudflare deployment evidence recorded in Supabase ATLAS Manager." >> "$GITHUB_STEP_SUMMARY"