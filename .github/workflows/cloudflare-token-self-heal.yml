name: ATLAS Cloudflare Token Self-Heal

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cloudflare-token-self-heal.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  repair-cloudflare-token:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LEGACY_WORKER: atlas-enterprise-suite
      CANONICAL_WORKER: atlas-enterprise-suite-web
    steps:
      - uses: actions/checkout@v5

      - name: Reconcile legacy trigger with existing token capability
        id: direct
        shell: bash
        run: |
          set -euo pipefail
          echo "direct_access=false" >> "$GITHUB_OUTPUT"

          ACCOUNT_ID="$(node -e "const fs=require('fs');const c=fs.readFileSync('wrangler.jsonc','utf8');const m=c.match(/\\\"account_id\\\"\\s*:\\s*\\\"([^\\\"]+)\\\"/);process.stdout.write(m?.[1]||'')")"
          test -n "$ACCOUNT_ID" || { echo "::error::Cloudflare account_id missing"; exit 1; }

          SCRIPTS_HTTP="$(curl --silent --show-error --max-time 30 \
            --output /tmp/cf-direct-workers-scripts.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts" || true)"

          if [ "$SCRIPTS_HTTP" != "200" ]; then
            echo "Direct Workers API capability unavailable (HTTP $SCRIPTS_HTTP); attempting token-policy repair without weakening fail-closed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          LEGACY_TAG="$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/cf-direct-workers-scripts.json','utf8'));const x=(j.result||[]).find(v=>String(v.id||v.name||'')===process.env.LEGACY_WORKER);process.stdout.write(String(x?.tag||''))")"
          if [ -z "$LEGACY_TAG" ]; then
            echo "direct_access=true" >> "$GITHUB_OUTPUT"
            echo "state=verified" >> "$GITHUB_STEP_SUMMARY"
            echo "Legacy Worker is already absent; no legacy Workers Builds trigger can remain." >> "$GITHUB_STEP_SUMMARY"
            echo "Canonical Worker $CANONICAL_WORKER was not modified." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          TRIGGERS_HTTP="$(curl --silent --show-error --max-time 30 \
            --output /tmp/cf-direct-triggers.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/builds/workers/$LEGACY_TAG/triggers" || true)"

          if [ "$TRIGGERS_HTTP" != "200" ]; then
            echo "Direct Workers Builds capability unavailable (HTTP $TRIGGERS_HTTP); attempting token-policy repair without weakening fail-closed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node - /tmp/cf-direct-triggers.json "$GITHUB_REPOSITORY_OWNER" "${GITHUB_REPOSITORY#*/}" > /tmp/direct-legacy-trigger-ids.txt <<'NODE'
          const fs=require('fs');
          const [file,owner,repo]=process.argv.slice(2);
          const j=JSON.parse(fs.readFileSync(file,'utf8'));
          for(const trigger of j.result||[]){
            const connection=trigger?.repo_connection||{};
            if(String(connection.provider_type||'').toLowerCase()==='github' &&
               String(connection.repo_name||'')===repo &&
               (!connection.provider_account_name||String(connection.provider_account_name)===owner) &&
               trigger?.trigger_uuid){
              process.stdout.write(String(trigger.trigger_uuid)+'\n');
            }
          }
          NODE

          DELETE_FAILED=false
          while IFS= read -r TRIGGER_ID; do
            [ -n "$TRIGGER_ID" ] || continue
            DELETE_HTTP="$(curl --silent --show-error --max-time 30 \
              --output /tmp/cf-direct-trigger-delete.json --write-out '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/builds/triggers/$TRIGGER_ID" || true)"
            DELETE_OK="$(node -e "const fs=require('fs');let j={};try{j=JSON.parse(fs.readFileSync('/tmp/cf-direct-trigger-delete.json','utf8'))}catch{};process.stdout.write(String(j.success===true))")"
            if [ "$DELETE_HTTP" != "200" ] || [ "$DELETE_OK" != "true" ]; then
              DELETE_FAILED=true
              break
            fi
          done < /tmp/direct-legacy-trigger-ids.txt

          if [ "$DELETE_FAILED" = "true" ]; then
            echo "Existing token can inspect Workers Builds but could not delete the legacy trigger; attempting token-policy repair." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          RECHECK_HTTP="$(curl --silent --show-error --max-time 30 \
            --output /tmp/cf-direct-triggers-recheck.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/builds/workers/$LEGACY_TAG/triggers" || true)"

          if [ "$RECHECK_HTTP" != "200" ]; then
            echo "Legacy trigger deletion could not be re-verified; attempting token-policy repair." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          REMAINING="$(node - /tmp/cf-direct-triggers-recheck.json "$GITHUB_REPOSITORY_OWNER" "${GITHUB_REPOSITORY#*/}" <<'NODE'
          const fs=require('fs');
          const [file,owner,repo]=process.argv.slice(2);
          const j=JSON.parse(fs.readFileSync(file,'utf8'));
          const remaining=(j.result||[]).filter(trigger=>{
            const connection=trigger?.repo_connection||{};
            return String(connection.provider_type||'').toLowerCase()==='github' &&
              String(connection.repo_name||'')===repo &&
              (!connection.provider_account_name||String(connection.provider_account_name)===owner) &&
              trigger?.trigger_uuid;
          }).length;
          process.stdout.write(String(remaining));
          NODE
          )"

          if [ "$REMAINING" != "0" ]; then
            echo "Legacy trigger still exists after the direct reconciliation attempt; attempting token-policy repair." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "direct_access=true" >> "$GITHUB_OUTPUT"
          echo "state=verified" >> "$GITHUB_STEP_SUMMARY"
          echo "Existing Cloudflare token capability was sufficient; noncanonical legacy GitHub Workers Builds trigger is absent." >> "$GITHUB_STEP_SUMMARY"
          echo "Canonical Worker $CANONICAL_WORKER was not modified." >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect and repair Cloudflare token policy
        if: steps.direct.outputs.direct_access != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(node -e "const fs=require('fs');const c=fs.readFileSync('wrangler.jsonc','utf8');const m=c.match(/\\\"account_id\\\"\\s*:\\s*\\\"([^\\\"]+)\\\"/);process.stdout.write(m?.[1]||'')")"
          test -n "$ACCOUNT_ID" || { echo "::error::Cloudflare account_id missing"; exit 1; }

          VERIFY_HTTP="$(curl --silent --show-error --max-time 30             --output /tmp/cf-token-verify.json --write-out '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             https://api.cloudflare.com/client/v4/user/tokens/verify || true)"
          test "$VERIFY_HTTP" = "200" || { echo "::error::Cloudflare token is not a valid user-scoped token"; exit 1; }

          TOKEN_ID="$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/cf-token-verify.json','utf8'));process.stdout.write(String(j.result?.id||''))")"
          test -n "$TOKEN_ID" || { echo "::error::Cloudflare token id unavailable"; exit 1; }

          DETAIL_HTTP="$(curl --silent --show-error --max-time 30             --output /tmp/cf-token-detail.json --write-out '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/user/tokens/$TOKEN_ID" || true)"

          GROUPS_HTTP="$(curl --silent --show-error --max-time 30             --output /tmp/cf-permission-groups.json --write-out '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/user/tokens/permission_groups" || true)"

          if [ "$DETAIL_HTTP" != "200" ] || [ "$GROUPS_HTTP" != "200" ]; then
            echo "state=external_admin_gate" >> "$GITHUB_STEP_SUMMARY"
            echo "Cloudflare token cannot read/manage its own policy. A Cloudflare user token with User > API Tokens > Write must perform the permission update." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Cloudflare token policy is not self-repairable; failing closed."
            exit 1
          fi

          node - "$ACCOUNT_ID" <<'NODE'
          const fs=require('fs');
          const accountId=process.argv[2];
          const detail=JSON.parse(fs.readFileSync('/tmp/cf-token-detail.json','utf8')).result;
          const groups=JSON.parse(fs.readFileSync('/tmp/cf-permission-groups.json','utf8')).result||[];
          const wanted=groups.filter(g =>
            g.scopes?.includes('com.cloudflare.api.account') &&
            (
              /^Workers CI (Read|Edit|Write)$/i.test(g.name||'') ||
              /^Workers Builds Configuration (Read|Edit|Write)$/i.test(g.name||'')
            )
          );
          if(!wanted.length) throw new Error('workers_ci_permission_groups_not_found');

          const policies=structuredClone(detail.policies||[]);
          let policy=policies.find(p =>
            p.effect==='allow' &&
            Object.keys(p.resources||{}).some(k => k===`com.cloudflare.api.account.${accountId}` || k==='com.cloudflare.api.account.*')
          );
          if(!policy){
            policy={effect:'allow',resources:{[`com.cloudflare.api.account.${accountId}`]:'*'},permission_groups:[]};
            policies.push(policy);
          }
          const ids=new Set((policy.permission_groups||[]).map(g=>g.id));
          for(const g of wanted){
            if(!ids.has(g.id)) policy.permission_groups.push({id:g.id});
          }

          const body={name:detail.name,policies,status:detail.status||'active'};
          if(detail.condition) body.condition=detail.condition;
          if(detail.expires_on) body.expires_on=detail.expires_on;
          if(detail.not_before) body.not_before=detail.not_before;
          fs.writeFileSync('/tmp/cf-token-update.json',JSON.stringify(body));
          fs.writeFileSync('/tmp/cf-workers-permissions.txt',wanted.map(g=>g.name).join(', '));
          NODE

          UPDATE_HTTP="$(curl --silent --show-error --max-time 30             --output /tmp/cf-token-updated.json --write-out '%{http_code}'             -X PUT             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H 'Content-Type: application/json'             --data-binary @/tmp/cf-token-update.json             "https://api.cloudflare.com/client/v4/user/tokens/$TOKEN_ID" || true)"

          if [ "$UPDATE_HTTP" != "200" ]; then
            echo "state=external_admin_gate" >> "$GITHUB_STEP_SUMMARY"
            echo "Cloudflare refused self-update. Existing token lacks User > API Tokens > Write; provider-side administrator action is required." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Cloudflare token permission repair was refused; failing closed."
            exit 1
          fi

          SCRIPTS_HTTP="$(curl --silent --show-error --max-time 30             --output /tmp/cf-workers-scripts.json --write-out '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts" || true)"
          test "$SCRIPTS_HTTP" = "200" || { echo "::error::Unable to resolve Cloudflare Worker tags after token repair"; exit 1; }

          LEGACY_TAG="$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/cf-workers-scripts.json','utf8'));const x=(j.result||[]).find(v=>String(v.id||v.name||'')===process.env.LEGACY_WORKER);process.stdout.write(String(x?.tag||''))")"
          if [ -z "$LEGACY_TAG" ]; then
            echo "state=repaired" >> "$GITHUB_STEP_SUMMARY"
            echo "Legacy Worker is already absent; no Workers Builds trigger can remain." >> "$GITHUB_STEP_SUMMARY"
            echo "Canonical Worker $CANONICAL_WORKER was not modified." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          TRIGGERS_HTTP="$(curl --silent --show-error --max-time 30             --output /tmp/cf-triggers.json --write-out '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/builds/workers/$LEGACY_TAG/triggers" || true)"
          test "$TRIGGERS_HTTP" = "200" || { echo "::error::Workers Builds API still unavailable after token update"; exit 1; }

          node - /tmp/cf-triggers.json "$GITHUB_REPOSITORY_OWNER" "${GITHUB_REPOSITORY#*/}" > /tmp/legacy-trigger-ids.txt <<'NODE'
          const fs=require('fs');
          const [file,owner,repo]=process.argv.slice(2);
          const j=JSON.parse(fs.readFileSync(file,'utf8'));
          for(const trigger of j.result||[]){
            const c=trigger?.repo_connection||{};
            if(String(c.provider_type||'').toLowerCase()==='github' &&
               String(c.repo_name||'')===repo &&
               (!c.provider_account_name||String(c.provider_account_name)===owner) &&
               trigger?.trigger_uuid){
              process.stdout.write(String(trigger.trigger_uuid)+'\n');
            }
          }
          NODE

          while IFS= read -r TRIGGER_ID; do
            [ -n "$TRIGGER_ID" ] || continue
            DELETE_HTTP="$(curl --silent --show-error --max-time 30               --output /tmp/cf-trigger-delete.json --write-out '%{http_code}'               -X DELETE               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/builds/triggers/$TRIGGER_ID" || true)"
            DELETE_OK="$(node -e "const fs=require('fs');let j={};try{j=JSON.parse(fs.readFileSync('/tmp/cf-trigger-delete.json','utf8'))}catch{};process.stdout.write(String(j.success===true))")"
            test "$DELETE_HTTP" = "200" && test "$DELETE_OK" = "true" || { echo "::error::Legacy trigger deletion failed"; exit 1; }
          done < /tmp/legacy-trigger-ids.txt

          echo "state=repaired" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare token permission policy repaired and noncanonical legacy GitHub Workers Builds trigger removed when present." >> "$GITHUB_STEP_SUMMARY"
          echo "Canonical Worker $CANONICAL_WORKER was not modified." >> "$GITHUB_STEP_SUMMARY"


  global-production-verification:
    needs: repair-cloudflare-token
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/global-production-verify.yml
    with:
      mode: fail-closed
