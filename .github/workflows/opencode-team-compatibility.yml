name: OpenCode Team ATLAS Compatibility Pilot
on:
  pull_request:
    paths:
      - '.opencode.jsonc'
      - 'AGENTS.md'
      - 'packages/agent-registry/**'
      - 'apps/atlas-orchestrator/**'
      - 'tests/node/opencode-team-compatibility.test.mjs'
      - 'tests/node/opencode-role-mapping.test.mjs'
      - 'docs/integrations/OPENCODE_TEAM_777_PILOT.md'
      - '.github/workflows/opencode-team-compatibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/node/opencode-team-compatibility.test.mjs tests/node/opencode-role-mapping.test.mjs
