name: ATLAS OpenAI Domain DNS Reconciliation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/openai-domain-dns-reconcile.yml"

permissions:
  contents: read

jobs:
  reconcile-openai-domain-txt:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      DOMAIN: atlasenterprisesuite.com
      TXT_VALUE: openai-domain-verification=dv-D4JRMoEd80HhyW05wDAYS32z
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Validate Cloudflare authorization
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Cloudflare API token is unavailable"; exit 1; }
          HTTP="$(curl --silent --show-error --max-time 30             -o /tmp/cf-token.json -w '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H 'Content-Type: application/json'             'https://api.cloudflare.com/client/v4/user/tokens/verify' || true)"
          ACTIVE="$(node -e "const fs=require('fs');let j={};try{j=JSON.parse(fs.readFileSync('/tmp/cf-token.json','utf8'))}catch{};process.stdout.write(String(j.success===true&&j.result?.status==='active'))")"
          if [ "$HTTP" != "200" ] || [ "$ACTIVE" != "true" ]; then
            HTTP="$(curl --silent --show-error --max-time 30               -o /tmp/cf-accounts.json -w '%{http_code}'               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H 'Content-Type: application/json'               'https://api.cloudflare.com/client/v4/accounts' || true)"
            test "$HTTP" = "200" || { echo "::error::Cloudflare authorization could not be verified"; exit 1; }
          fi

      - name: Reconcile root OpenAI verification TXT
        id: dns
        run: |
          set -euo pipefail
          ZONE_HTTP="$(curl --silent --show-error --max-time 30             -o /tmp/cf-zone.json -w '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H 'Content-Type: application/json'             "https://api.cloudflare.com/client/v4/zones?name=$DOMAIN&status=active" || true)"
          test "$ZONE_HTTP" = "200" || { echo "::error::Unable to resolve Cloudflare zone"; exit 1; }
          ZONE_ID="$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/cf-zone.json','utf8'));const z=(j.result||[]).find(x=>x.name===process.env.DOMAIN);if(z)process.stdout.write(z.id)")"
          test -n "$ZONE_ID" || { echo "::error::Authoritative Cloudflare zone not found"; exit 1; }

          RECORDS_HTTP="$(curl --silent --show-error --max-time 30             -o /tmp/cf-records.json -w '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H 'Content-Type: application/json'             "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=TXT&name=$DOMAIN&per_page=100" || true)"
          if [ "$RECORDS_HTTP" != "200" ]; then
            PROVIDER_CODE="$(node -e "const fs=require('fs');let j={};try{j=JSON.parse(fs.readFileSync('/tmp/cf-records.json','utf8'))}catch{};process.stdout.write(String(j.errors?.[0]?.code||''))")"
            PROVIDER_MESSAGE="$(node -e "const fs=require('fs');let j={};try{j=JSON.parse(fs.readFileSync('/tmp/cf-records.json','utf8'))}catch{};const m=String(j.errors?.[0]?.message||'');process.stdout.write(m.replace(/[A-Za-z0-9_-]{24,}/g,'[redacted]'))")"
            echo "Cloudflare DNS list failed: HTTP $RECORDS_HTTP provider_code=${PROVIDER_CODE:-none}" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Unable to inspect root TXT records (HTTP $RECORDS_HTTP, provider code ${PROVIDER_CODE:-none}, message: ${PROVIDER_MESSAGE:-none})"
            exit 1
          fi

          node - <<'NODE' > /tmp/openai-stale-ids.txt
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/cf-records.json','utf8'));
          const expected=process.env.TXT_VALUE;
          const stale=(j.result||[]).filter(r=>String(r.content||'').startsWith('openai-domain-verification=') && r.content!==expected);
          for (const r of stale) console.log(r.id);
          NODE

          STALE_COUNT="$(wc -l < /tmp/openai-stale-ids.txt | tr -d ' ')"
          if [ "$STALE_COUNT" -gt 0 ]; then
            while IFS= read -r RECORD_ID; do
              test -n "$RECORD_ID" || continue
              DELETE_HTTP="$(curl --silent --show-error --max-time 30                 -o /tmp/cf-delete.json -w '%{http_code}'                 -X DELETE                 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"                 -H 'Content-Type: application/json'                 "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RECORD_ID" || true)"
              DELETED="$(node -e "const fs=require('fs');let j={};try{j=JSON.parse(fs.readFileSync('/tmp/cf-delete.json','utf8'))}catch{};process.stdout.write(String(j.success===true))")"
              if [ "$DELETE_HTTP" != "200" ] || [ "$DELETED" != "true" ]; then
                echo "::error::Cloudflare rejected removal of a stale OpenAI verification TXT."
                exit 1
              fi
            done < /tmp/openai-stale-ids.txt
            echo "Removed $STALE_COUNT stale OpenAI verification TXT record(s)." >> "$GITHUB_STEP_SUMMARY"
          fi

          RECORDS_HTTP="$(curl --silent --show-error --max-time 30             -o /tmp/cf-records-after-delete.json -w '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H 'Content-Type: application/json'             "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=TXT&name=$DOMAIN&per_page=100" || true)"
          test "$RECORDS_HTTP" = "200" || exit 1
          EXACT_COUNT="$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/cf-records-after-delete.json','utf8'));process.stdout.write(String((j.result||[]).filter(x=>x.content===process.env.TXT_VALUE).length))")"

          if [ "$EXACT_COUNT" = "0" ]; then
            BODY="$(node -e "process.stdout.write(JSON.stringify({type:'TXT',name:process.env.DOMAIN,content:process.env.TXT_VALUE,ttl:120}))")"
            CREATE_HTTP="$(curl --silent --show-error --max-time 30               -o /tmp/cf-create.json -w '%{http_code}'               -X POST               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H 'Content-Type: application/json'               "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records"               --data "$BODY" || true)"
            CREATED="$(node -e "const fs=require('fs');let j={};try{j=JSON.parse(fs.readFileSync('/tmp/cf-create.json','utf8'))}catch{};process.stdout.write(String(j.success===true))")"
            if [ "$CREATE_HTTP" != "200" ] || [ "$CREATED" != "true" ]; then
              echo "::error::Cloudflare did not accept the exact OpenAI TXT."
              exit 1
            fi
          elif [ "$EXACT_COUNT" != "1" ]; then
            echo "::error::Unexpected duplicate exact OpenAI verification TXT records."
            exit 1
          fi

          VERIFY_HTTP="$(curl --silent --show-error --max-time 30             -o /tmp/cf-verify.json -w '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H 'Content-Type: application/json'             "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=TXT&name=$DOMAIN&per_page=100" || true)"
          test "$VERIFY_HTTP" = "200" || exit 1
          PROVIDER_EXACT="$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/cf-verify.json','utf8'));const a=(j.result||[]).filter(x=>String(x.content||'').startsWith('openai-domain-verification='));process.stdout.write(String(a.length===1&&a[0].content===process.env.TXT_VALUE))")"
          test "$PROVIDER_EXACT" = "true" || { echo "::error::Provider readback is not the single expected OpenAI TXT"; exit 1; }

          DIGEST="$(printf '%s' "$TXT_VALUE" | sha256sum | awk '{print $1}')"
          echo "provider_verified=true" >> "$GITHUB_OUTPUT"
          echo "value_digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Cloudflare provider state contains exactly one authorized OpenAI verification TXT (SHA-256 $DIGEST)." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify public DNS propagation
        id: public_dns
        run: |
          set -euo pipefail
          VERIFIED=false
          for ATTEMPT in $(seq 1 48); do
            HTTP="$(curl --silent --show-error --max-time 20               -o /tmp/doh.json -w '%{http_code}'               -H 'accept: application/dns-json'               "https://cloudflare-dns.com/dns-query?name=$DOMAIN&type=TXT" || true)"
            if [ "$HTTP" = "200" ]; then
              VERIFIED="$(node -e "const fs=require('fs');let j={};try{j=JSON.parse(fs.readFileSync('/tmp/doh.json','utf8'))}catch{};const vals=(j.Answer||[]).filter(x=>x.type===16).map(x=>String(x.data||'').replace(/^\"|\"$/g,''));const o=vals.filter(x=>x.startsWith('openai-domain-verification='));process.stdout.write(String(o.length===1&&o[0]===process.env.TXT_VALUE))")"
              if [ "$VERIFIED" = "true" ]; then break; fi
            fi
            sleep 5
          done
          test "$VERIFIED" = "true" || { echo "::error::Public DNS did not converge to the single expected OpenAI TXT before timeout"; exit 1; }
          echo "verified=true" >> "$GITHUB_OUTPUT"
          echo "Public DNS exact-match verification passed for $DOMAIN." >> "$GITHUB_STEP_SUMMARY"
