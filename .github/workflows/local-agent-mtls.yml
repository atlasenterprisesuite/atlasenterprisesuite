name: ATLAS Local Agent mTLS

on:
  workflow_dispatch:
    inputs:
      action:
        description: Issue or revoke an ATLAS Local Agent certificate
        required: true
        type: choice
        options: [issue, revoke]
      organization_id:
        description: ATLAS organization UUID
        required: true
        type: string
      agent_id:
        description: ATLAS Local Agent UUID
        required: true
        type: string
      csr_base64:
        description: Base64-encoded public CSR (required for issue; never submit a private key)
        required: false
        type: string
      certificate_id:
        description: Cloudflare client certificate ID (required for revoke)
        required: false
        type: string
      validity_days:
        description: Certificate validity in days
        required: false
        default: "365"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: atlas-local-agent-mtls-${{ inputs.agent_id }}
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      ZONE_NAME: atlasenterprisesuite.com
      MTLS_HOSTNAME: www.atlasenterprisesuite.com
      CONTROL_CALLBACK: https://ggmanzcgtlrvqfoccgsh.supabase.co/functions/v1/atlas-local-control?api=mtls-provision-callback
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate request
        env:
          REQUEST_ACTION: ${{ inputs.action }}
          CSR_BASE64: ${{ inputs.csr_base64 }}
          CERTIFICATE_ID: ${{ inputs.certificate_id }}
          VALIDITY_DAYS: ${{ inputs.validity_days }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured."; exit 1; }
          case "$REQUEST_ACTION" in
            issue)
              test -n "$CSR_BASE64" || { echo "::error::csr_base64 is required for issue."; exit 1; }
              printf '%s' "$CSR_BASE64" | base64 --decode > /tmp/atlas-agent.csr
              grep -q -- '-----BEGIN CERTIFICATE REQUEST-----' /tmp/atlas-agent.csr || { echo "::error::Input is not a PEM CSR."; exit 1; }
              if grep -q -- 'PRIVATE KEY' /tmp/atlas-agent.csr; then
                echo "::error::Private keys are forbidden. Generate the key on the agent host and submit only the CSR."
                exit 1
              fi
              node -e "const n=Number(process.env.VALIDITY_DAYS); if(!Number.isInteger(n)||n<1||n>3650) process.exit(1)"
              ;;
            revoke)
              test -n "$CERTIFICATE_ID" || { echo "::error::certificate_id is required for revoke."; exit 1; }
              ;;
            *) exit 1 ;;
          esac

      - name: Resolve Cloudflare zone
        id: zone
        run: |
          set -euo pipefail
          HTTP="$(curl --silent --show-error --max-time 30 -o /tmp/zone.json -w '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H 'Content-Type: application/json'             "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME&status=active")"
          ZONE_ID="$(node -e "const j=require('/tmp/zone.json');process.stdout.write(String(j.result?.[0]?.id||''))")"
          if [ "$HTTP" != "200" ] || [ -z "$ZONE_ID" ]; then
            CODE="$(node -e "const j=require('/tmp/zone.json');process.stdout.write(String(j.errors?.[0]?.code||''))")"
            echo "::error::Cloudflare zone resolution failed (HTTP $HTTP, provider code ${CODE:-none})."
            exit 1
          fi
          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"

      - name: Ensure Cloudflare-managed CA hostname association
        if: inputs.action == 'issue'
        env:
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          set -euo pipefail
          HTTP="$(curl --silent --show-error --max-time 30 -o /tmp/associations.json -w '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/certificate_authorities/hostname_associations")"
          if [ "$HTTP" != "200" ]; then
            CODE="$(node -e "const j=require('/tmp/associations.json');process.stdout.write(String(j.errors?.[0]?.code||''))")"
            echo "::error::Cloudflare mTLS hostname lookup failed (HTTP $HTTP, provider code ${CODE:-none}). The production token needs SSL and Certificates Write."
            exit 1
          fi
          node - <<'NODE' > /tmp/associations-update.json
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/associations.json','utf8'));
          const host=process.env.MTLS_HOSTNAME;
          const hostnames=[...new Set([...(j.result?.hostnames||[]),host])];
          process.stdout.write(JSON.stringify({hostnames}));
          NODE
          HTTP="$(curl --silent --show-error --max-time 30 -o /tmp/associations-result.json -w '%{http_code}'             -X PUT             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H 'Content-Type: application/json'             --data-binary @/tmp/associations-update.json             "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/certificate_authorities/hostname_associations")"
          OK="$(node -e "const j=require('/tmp/associations-result.json');process.stdout.write(String(j.success===true&&j.result?.hostnames?.includes(process.env.MTLS_HOSTNAME)))")"
          if [ "$HTTP" != "200" ] || [ "$OK" != "true" ]; then
            CODE="$(node -e "const j=require('/tmp/associations-result.json');process.stdout.write(String(j.errors?.[0]?.code||''))")"
            echo "::error::Cloudflare mTLS hostname association failed (HTTP $HTTP, provider code ${CODE:-none})."
            exit 1
          fi

      - name: Issue Cloudflare-managed client certificate
        if: inputs.action == 'issue'
        id: issue
        env:
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
          VALIDITY_DAYS: ${{ inputs.validity_days }}
        run: |
          set -euo pipefail
          node - <<'NODE' > /tmp/certificate-request.json
          const fs=require('fs');
          process.stdout.write(JSON.stringify({
            csr:fs.readFileSync('/tmp/atlas-agent.csr','utf8'),
            validity_days:Number(process.env.VALIDITY_DAYS)
          }));
          NODE
          HTTP="$(curl --silent --show-error --max-time 30 -o /tmp/certificate-response.json -w '%{http_code}'             -X POST             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H 'Content-Type: application/json'             --data-binary @/tmp/certificate-request.json             "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/client_certificates")"
          OK="$(node -e "const j=require('/tmp/certificate-response.json');process.stdout.write(String(j.success===true&&j.result?.id&&j.result?.certificate&&j.result?.fingerprint_sha256))")"
          if [ "$HTTP" != "200" ] || [ "$OK" != "true" ]; then
            CODE="$(node -e "const j=require('/tmp/certificate-response.json');process.stdout.write(String(j.errors?.[0]?.code||''))")"
            echo "::error::Cloudflare client certificate issuance failed (HTTP $HTTP, provider code ${CODE:-none})."
            exit 1
          fi
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/certificate-response.json','utf8')).result;
          fs.mkdirSync('local-agent-mtls',{recursive:true});
          fs.writeFileSync('local-agent-mtls/atlas-local-agent.crt',j.certificate);
          fs.writeFileSync('local-agent-mtls/metadata.json',JSON.stringify({
            certificate_id:j.id,
            fingerprint_sha256:j.fingerprint_sha256,
            serial:j.serial_number,
            issued_on:j.issued_on,
            expires_on:j.expires_on,
            status:j.status
          },null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`certificate_id=${j.id}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`fingerprint_sha256=${j.fingerprint_sha256}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`serial=${j.serial_number}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`expires_on=${j.expires_on}\n`);
          NODE

      - name: Revoke Cloudflare client certificate
        if: inputs.action == 'revoke'
        env:
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
          CERTIFICATE_ID: ${{ inputs.certificate_id }}
        run: |
          set -euo pipefail
          HTTP="$(curl --silent --show-error --max-time 30 -o /tmp/revoke.json -w '%{http_code}'             -X DELETE             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/client_certificates/$CERTIFICATE_ID")"
          OK="$(node -e "const j=require('/tmp/revoke.json');process.stdout.write(String(j.success===true))")"
          if [ "$HTTP" != "200" ] || [ "$OK" != "true" ]; then
            CODE="$(node -e "const j=require('/tmp/revoke.json');process.stdout.write(String(j.errors?.[0]?.code||''))")"
            echo "::error::Cloudflare client certificate revocation failed (HTTP $HTTP, provider code ${CODE:-none})."
            exit 1
          fi

      - name: Obtain GitHub OIDC token
        id: oidc
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=atlas-local-agent-mtls-provision")"
          TOKEN="$(printf '%s' "$RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value||''))")"
          test -n "$TOKEN" || { echo "::error::GitHub OIDC token was not issued."; exit 1; }
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Synchronize ATLAS certificate binding
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          REQUEST_ACTION: ${{ inputs.action }}
          ORGANIZATION_ID: ${{ inputs.organization_id }}
          AGENT_ID: ${{ inputs.agent_id }}
          INPUT_CERTIFICATE_ID: ${{ inputs.certificate_id }}
          ISSUED_CERTIFICATE_ID: ${{ steps.issue.outputs.certificate_id }}
          FINGERPRINT_SHA256: ${{ steps.issue.outputs.fingerprint_sha256 }}
          CERT_SERIAL: ${{ steps.issue.outputs.serial }}
          CERT_EXPIRES_ON: ${{ steps.issue.outputs.expires_on }}
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          set -euo pipefail
          if [ "$REQUEST_ACTION" = "issue" ]; then
            export CERTIFICATE_ID="$ISSUED_CERTIFICATE_ID"
            node -e "console.log(JSON.stringify({action:'issue',organization_id:process.env.ORGANIZATION_ID,agent_id:process.env.AGENT_ID,certificate_id:process.env.CERTIFICATE_ID,fingerprint_sha256:process.env.FINGERPRINT_SHA256,serial:process.env.CERT_SERIAL,expires_at:process.env.CERT_EXPIRES_ON}))" > /tmp/atlas-binding.json
          else
            export CERTIFICATE_ID="$INPUT_CERTIFICATE_ID"
            node -e "console.log(JSON.stringify({action:'revoke',organization_id:process.env.ORGANIZATION_ID,agent_id:process.env.AGENT_ID,certificate_id:process.env.CERTIFICATE_ID}))" > /tmp/atlas-binding.json
          fi

          STATUS=""
          for ATTEMPT in 1 2 3; do
            STATUS="$(curl --silent --show-error --max-time 30 -o /tmp/atlas-binding-response.json -w '%{http_code}'               -X POST               -H "Authorization: Bearer $OIDC_TOKEN"               -H 'Content-Type: application/json'               --data-binary @/tmp/atlas-binding.json               "$CONTROL_CALLBACK" || true)"
            OK="$(node -e "let j={};try{j=require('/tmp/atlas-binding-response.json')}catch{};process.stdout.write(String(j.ok===true))")"
            [ "$STATUS" = "200" ] && [ "$OK" = "true" ] && break
            sleep 2
          done
          if [ "${OK:-false}" != "true" ]; then
            if [ "$REQUEST_ACTION" = "issue" ] && [ -n "$CERTIFICATE_ID" ]; then
              curl --silent --show-error --max-time 30 -X DELETE                 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"                 "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/client_certificates/$CERTIFICATE_ID" >/dev/null || true
            fi
            ERROR="$(node -e "let j={};try{j=require('/tmp/atlas-binding-response.json')}catch{};process.stdout.write(String(j.error||'unknown'))")"
            echo "::error::ATLAS certificate binding synchronization failed (HTTP ${STATUS:-none}, $ERROR). Issued certificates are revoked on rollback."
            exit 1
          fi

      - name: Upload public certificate
        if: inputs.action == 'issue'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-local-agent-mtls-${{ inputs.agent_id }}
          path: local-agent-mtls/
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        run: |
          {
            echo "### ATLAS Local Agent mTLS"
            echo "- Action: ${{ inputs.action }}"
            echo "- Agent: ${{ inputs.agent_id }}"
            echo "- Cloudflare-managed CA hostname: $MTLS_HOSTNAME"
            echo "- Private key uploaded: false"
            if [ "${{ inputs.action }}" = "issue" ]; then
              echo "- Certificate ID: ${{ steps.issue.outputs.certificate_id }}"
              echo "- Fingerprint: ${{ steps.issue.outputs.fingerprint_sha256 }}"
              echo "- ATLAS binding synchronized: true"
            else
              echo "- Certificate ID revoked: ${{ inputs.certificate_id }}"
              echo "- ATLAS binding synchronized: true"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
