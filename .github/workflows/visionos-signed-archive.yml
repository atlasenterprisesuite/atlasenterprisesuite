name: ATLAS visionOS Signed Archive

on:
  workflow_dispatch:
    inputs:
      signing_identity:
        description: Apple code-signing identity available in the imported PKCS#12
        required: true
        default: Apple Development
        type: string

permissions:
  contents: read

jobs:
  signed-archive:
    name: Signed visionOS archive
    runs-on: macos-26
    timeout-minutes: 30
    environment: visionos-release
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      TEMP_KEYCHAIN_PASSWORD: ${{ secrets.TEMP_KEYCHAIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail closed on missing signing material
        run: |
          set -euo pipefail
          for name in APPLE_TEAM_ID APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_PROVISIONING_PROFILE_BASE64 TEMP_KEYCHAIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required visionOS release secret $name is missing."
              exit 1
            fi
          done

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec apps/visionos/AtlasSpatial/project.yml

      - name: Import signing identity
        env:
          SIGNING_IDENTITY: ${{ inputs.signing_identity }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/atlas-visionos-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/atlas-visionos.keychain-db"

          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$TEMP_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$TEMP_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$TEMP_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "$SIGNING_IDENTITY"

      - name: Install provisioning profile
        id: profile
        run: |
          set -euo pipefail
          PROFILE_PATH="$RUNNER_TEMP/atlas-visionos.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/atlas-visionos-profile.plist"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")

          test "$PROFILE_TEAM" = "$APPLE_TEAM_ID" || { echo "::error::Provisioning profile team does not match APPLE_TEAM_ID"; exit 1; }
          case "$APP_ID" in
            "$APPLE_TEAM_ID.com.atlasenterprisesuite.spatial") ;;
            *) echo "::error::Provisioning profile does not authorize com.atlasenterprisesuite.spatial"; exit 1 ;;
          esac

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"

      - name: Archive signed ATLAS Spatial
        env:
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
          SIGNING_IDENTITY: ${{ inputs.signing_identity }}
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/AtlasSpatial.xcarchive"

          xcodebuild \
            -project apps/visionos/AtlasSpatial/AtlasSpatial.xcodeproj \
            -scheme AtlasSpatial \
            -configuration Release \
            -sdk xros \
            -destination 'generic/platform=visionOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

          APP_PATH="$ARCHIVE_PATH/Products/Applications/ATLAS Spatial.app"
          test -d "$APP_PATH" || { echo "::error::Signed visionOS app bundle was not produced"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -E 'Identifier=|TeamIdentifier='

          {
            echo "### ATLAS Spatial signed archive"
            echo "- archive: verified"
            echo "- codesign: verified"
            echo "- bundle id: com.atlasenterprisesuite.spatial"
            echo "- physical Vision Pro verification: still required"
            echo "- live: false until device verification and approved distribution pass"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean signing material
        if: always()
        run: |
          set +e
          security delete-keychain "$RUNNER_TEMP/atlas-visionos.keychain-db"
          rm -f "$RUNNER_TEMP/atlas-visionos-signing.p12"
          rm -f "$RUNNER_TEMP/atlas-visionos.mobileprovision"
          rm -f "$RUNNER_TEMP/atlas-visionos-profile.plist"
