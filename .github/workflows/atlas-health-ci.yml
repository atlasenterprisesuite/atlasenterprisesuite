name: ATLAS Health CI

on:
  push:
    branches: ["feat/atlas-health-adventhealth-ecosystem"]
  pull_request:
    branches: ["main"]

concurrency:
  group: atlas-health-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  health-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - name: Guard against copied reference metrics
        run: |
          ! grep -R -E '98%|2,847|1,523|96%' apps/web/src packages/health data/demo/health

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: High-severity dependency audit
        timeout-minutes: 2
        run: npm audit --audit-level=high
