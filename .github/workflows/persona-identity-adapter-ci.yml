name: ATLAS Persona Identity Adapter CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["feat/persona-identity-adapter-777-20261106"]

permissions:
  contents: read

jobs:
  persona-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install locked dependencies
        run: npm ci
      - name: Verify Persona signed-event contract
        run: npx vitest run tests/unit/persona-verification.test.ts
      - name: Verify Persona backend fail-closed source contract
        run: npx vitest run tests/integration/persona-sandbox-backend-contract.test.ts
      - name: Verify live CI monitor truthfulness
        run: npx vitest run tests/unit/persona-ci-monitor.test.ts
      - name: Typecheck
        run: npm run typecheck
