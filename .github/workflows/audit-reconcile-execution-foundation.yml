name: ATLAS Audit Reconcile Execution Foundation

on:
  push:
    branches:
      - audit/atlas-production-runner-closure-2026-09-13
    paths:
      - ".github/workflows/audit-reconcile-execution-foundation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-audit-execution-foundation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/atlas-production-runner-closure-2026-09-13
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Recover approved Universal Execution foundation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/universal-execution-engine
          git checkout FETCH_HEAD -- packages/execution tests/unit/execution-types.test.ts

      - name: Remove duplicate TenantScope import
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/core/src/index.ts')
          source = path.read_text()
          needle = "import type { TenantScope } from './scope';\n"
          if needle not in source:
              raise SystemExit('Expected duplicate TenantScope import not found')
          path.write_text(source.replace(needle, '', 1))
          PY

      - name: Synchronize npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify locked install
        run: npm ci

      - name: Verify execution foundation contract
        run: npx vitest run tests/unit/execution-types.test.ts

      - name: Verify TypeScript contract
        run: npm run typecheck

      - name: Validate patch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^(package-lock\.json|packages/core/src/index\.ts|packages/execution/|tests/unit/execution-types\.test\.ts)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changes:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit reconciled foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "atlas-audit-bot"
          git config user.email "atlashealthfrontiers@gmail.com"
          git add package-lock.json packages/core/src/index.ts packages/execution tests/unit/execution-types.test.ts
          git commit -m "fix(execution): restore canonical execution foundation"
          git push origin HEAD:audit/atlas-production-runner-closure-2026-09-13
