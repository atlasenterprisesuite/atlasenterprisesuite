name: ATLAS Motion Designer Verification
on:
  push:
    branches: [impl/atlas-motion-designer-sdd]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run tests/unit/atlas-motion-domain.test.ts
      - run: npm test
      - run: npm run build
