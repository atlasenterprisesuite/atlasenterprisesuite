name: ATLAS AI Council Security Gates
on:
  pull_request:
    paths:
      - 'supabase/functions/atlas-copilot/**'
      - 'tests/node/atlas-ai-council-security-gates.test.mjs'
      - 'tests/unit/atlas-model-configuration-777.test.ts'
      - 'tests/unit/atlas-provider-readiness-fail-closed-777.test.ts'
      - 'tests/unit/atlas-unified-ai-chat-source-contract.test.ts'
      - '.github/workflows/atlas-ai-council-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  council-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Council authentication and fail-closed boundaries
        run: node --test tests/node/atlas-ai-council-security-gates.test.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Fail-closed provider registry and gateway Vitest
        run: |
          npx vitest run \
            tests/unit/atlas-model-configuration-777.test.ts \
            tests/unit/atlas-provider-readiness-fail-closed-777.test.ts \
            tests/unit/atlas-unified-ai-chat-source-contract.test.ts \
            tests/unit/atlas-unified-ai-chat-routing.test.ts \
            tests/unit/atlas-unified-ai-chat-adapters.test.ts
