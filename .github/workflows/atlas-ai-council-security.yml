name: ATLAS AI Council Security Gates
on:
  pull_request:
    paths:
      - 'supabase/functions/atlas-copilot/**'
      - 'tests/node/atlas-ai-council-*.test.mjs'
      - 'docs/security/ai-council-approval-transaction.preview.sql'
      - '.github/workflows/atlas-ai-council-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  council-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Council authentication and fail-closed boundaries
        run: node --test tests/node/atlas-ai-council-security-gates.test.mjs tests/node/atlas-ai-council-approval-guard.test.mjs tests/node/atlas-ai-council-approval-store.test.mjs tests/node/atlas-ai-council-transaction-contract.test.mjs

  postgres-transaction-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run isolated transaction integration tests
        env:
          PGPASSWORD: postgres
        run: bash tests/postgres/run-ai-council-transaction-tests.sh
