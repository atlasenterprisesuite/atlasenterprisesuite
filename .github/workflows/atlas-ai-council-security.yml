name: ATLAS AI Council Security Gates
# This job is a required branch ruleset check. Path filters would leave the
# required council-security context absent for unrelated PRs, blocking merges.
# Run the existing negative security tests for every pull request (fail closed).
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  council-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Council authentication and fail-closed boundaries
        run: node --test tests/node/atlas-ai-council-security-gates.test.mjs
