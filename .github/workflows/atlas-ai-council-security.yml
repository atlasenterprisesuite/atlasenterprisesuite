name: ATLAS AI Council Security Gates
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  council-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Council authentication and fail-closed boundaries
        run: node --test tests/node/atlas-ai-council-security-gates.test.mjs
