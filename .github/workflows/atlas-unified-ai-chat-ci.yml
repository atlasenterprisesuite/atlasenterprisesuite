name: ATLAS Unified AI Chat CI

on:
  push:
    branches:
      - feat/atlas-unified-ai-chat
    paths:
      - 'supabase/functions/atlas-copilot/**'
      - 'tests/unit/atlas-unified-ai-chat-*.test.ts'
      - 'packages/creator/studio_orchestration.ts'
      - 'tests/unit/atlas-studio-orchestration.test.ts'
      - '.github/workflows/atlas-unified-ai-chat-ci.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/atlas-copilot/**'
      - 'tests/unit/atlas-unified-ai-chat-*.test.ts'
      - 'packages/creator/studio_orchestration.ts'
      - 'tests/unit/atlas-studio-orchestration.test.ts'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Focused unified AI tests
        run: npm exec vitest -- run tests/unit/atlas-unified-ai-chat-*.test.ts tests/unit/atlas-studio-orchestration.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build
