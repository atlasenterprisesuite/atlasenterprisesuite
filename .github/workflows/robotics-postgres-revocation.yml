name: Robotics PostgreSQL 17 isolated revocation proof
on:
  push:
    branches:
      - 'feat/robotics-simulation-tdd-777-20261101'
  pull_request:
    paths:
      - 'packages/robotics/**'
      - 'tests/robotics/**'
      - 'tests/unit/robotics-h-series-supabase-auth.test.ts'
      - '.github/workflows/robotics-postgres-revocation.yml'
      - 'supabase/migrations/20261101_robotics_simulation_isolated_draft.sql'
      - 'docs/robotics/phase5-postgres-isolated-prototype.sql'
      - 'docs/robotics/f19-guarded-auth-isolated.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  revocation-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: robotics
          POSTGRES_PASSWORD: robotics_ci_only
          POSTGRES_DB: robotics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U robotics -d robotics_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: robotics
      PGPASSWORD: robotics_ci_only
      PGDATABASE: robotics_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Robotics F21 scoped identity negative tests (Vitest)
        run: npx vitest run tests/unit/robotics-h-series-supabase-auth.test.ts
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check psycopg2-binary==2.9.10
      - name: PostgreSQL 17 transactional revocation negative tests
        run: |
          python tests/robotics/postgres_revocation_proof.py
          python tests/robotics/postgres_membership_revocation_proof.py
          python tests/robotics/f19_real_sql_gate.py
          python tests/robotics/f19_original_sql_transaction_proof.py
          python tests/robotics/f19_guarded_sql_gate.py
