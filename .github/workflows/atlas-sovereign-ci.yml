name: ATLAS Sovereign CI

on:
  workflow_dispatch:
    inputs:
      workflow_id:
        description: ATLAS execution workflow ID
        required: true
        type: string
      task_id:
        description: ATLAS execution task ID
        required: true
        type: string
      repository:
        description: Allowlisted source repository
        required: true
        type: string
      requested_ref:
        description: Explicit branch, tag, or SHA to verify
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: verify-sovereign-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enforce canonical repository
        run: |
          test "${{ inputs.repository }}" = "atlasenterprisesuite/atlasenterprisesuite" || {
            echo "::error::repository_not_allowed"
            exit 1
          }

      - name: Checkout requested target
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.requested_ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve immutable target SHA
        id: target
        run: |
          RESOLVED_SHA="$(git rev-parse HEAD)"
          test -n "$RESOLVED_SHA"
          echo "RESOLVED_SHA=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"

      - name: Runtime
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        run: |
          set +e
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npm ci 2>&1 | tee /tmp/atlas-ci-install.log
          exit_code="${PIPESTATUS[0]}"
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          output_digest="$(sha256sum /tmp/atlas-ci-install.log | awk '{print $1}')"
          {
            echo "exit_code=$exit_code"
            echo "output_digest=$output_digest"
            echo "started_at=$started_at"
            echo "completed_at=$completed_at"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Typecheck
        id: typecheck
        run: |
          set +e
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npm run typecheck 2>&1 | tee /tmp/atlas-ci-typecheck.log
          exit_code="${PIPESTATUS[0]}"
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          output_digest="$(sha256sum /tmp/atlas-ci-typecheck.log | awk '{print $1}')"
          {
            echo "exit_code=$exit_code"
            echo "output_digest=$output_digest"
            echo "started_at=$started_at"
            echo "completed_at=$completed_at"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Tests
        id: tests
        run: |
          set +e
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npm test 2>&1 | tee /tmp/atlas-ci-test.log
          exit_code="${PIPESTATUS[0]}"
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          output_digest="$(sha256sum /tmp/atlas-ci-test.log | awk '{print $1}')"
          {
            echo "exit_code=$exit_code"
            echo "output_digest=$output_digest"
            echo "started_at=$started_at"
            echo "completed_at=$completed_at"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build
        id: build
        run: |
          set +e
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npm run build 2>&1 | tee /tmp/atlas-ci-build.log
          exit_code="${PIPESTATUS[0]}"
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          output_digest="$(sha256sum /tmp/atlas-ci-build.log | awk '{print $1}')"
          {
            echo "exit_code=$exit_code"
            echo "output_digest=$output_digest"
            echo "started_at=$started_at"
            echo "completed_at=$completed_at"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build bounded report
        if: always()
        env:
          WORKFLOW_ID: ${{ inputs.workflow_id }}
          TASK_ID: ${{ inputs.task_id }}
          REPOSITORY: ${{ inputs.repository }}
          REQUESTED_REF: ${{ inputs.requested_ref }}
          RESOLVED_SHA: ${{ steps.target.outputs.RESOLVED_SHA }}
          INSTALL_EXIT: ${{ steps.install.outputs.exit_code }}
          INSTALL_DIGEST: ${{ steps.install.outputs.output_digest }}
          INSTALL_STARTED: ${{ steps.install.outputs.started_at }}
          INSTALL_COMPLETED: ${{ steps.install.outputs.completed_at }}
          TYPECHECK_EXIT: ${{ steps.typecheck.outputs.exit_code }}
          TYPECHECK_DIGEST: ${{ steps.typecheck.outputs.output_digest }}
          TYPECHECK_STARTED: ${{ steps.typecheck.outputs.started_at }}
          TYPECHECK_COMPLETED: ${{ steps.typecheck.outputs.completed_at }}
          TEST_EXIT: ${{ steps.tests.outputs.exit_code }}
          TEST_DIGEST: ${{ steps.tests.outputs.output_digest }}
          TEST_STARTED: ${{ steps.tests.outputs.started_at }}
          TEST_COMPLETED: ${{ steps.tests.outputs.completed_at }}
          BUILD_EXIT: ${{ steps.build.outputs.exit_code }}
          BUILD_DIGEST: ${{ steps.build.outputs.output_digest }}
          BUILD_STARTED: ${{ steps.build.outputs.started_at }}
          BUILD_COMPLETED: ${{ steps.build.outputs.completed_at }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const row = (command_identifier, exit, output_digest, started_at, completed_at) => ({
            command_identifier,
            exit_code: Number.isInteger(Number(exit)) ? Number(exit) : 255,
            output_digest: /^[a-f0-9]{64}$/.test(output_digest || '') ? output_digest : null,
            started_at: started_at || null,
            completed_at: completed_at || null
          });
          const payload = {
            workflow_id: process.env.WORKFLOW_ID,
            task_id: process.env.TASK_ID,
            repository: process.env.REPOSITORY,
            requested_ref: process.env.REQUESTED_REF,
            resolved_sha: process.env.RESOLVED_SHA || null,
            results: [
              row('install_dependencies', process.env.INSTALL_EXIT, process.env.INSTALL_DIGEST, process.env.INSTALL_STARTED, process.env.INSTALL_COMPLETED),
              row('typecheck', process.env.TYPECHECK_EXIT, process.env.TYPECHECK_DIGEST, process.env.TYPECHECK_STARTED, process.env.TYPECHECK_COMPLETED),
              row('test', process.env.TEST_EXIT, process.env.TEST_DIGEST, process.env.TEST_STARTED, process.env.TEST_COMPLETED),
              row('build', process.env.BUILD_EXIT, process.env.BUILD_DIGEST, process.env.BUILD_STARTED, process.env.BUILD_COMPLETED)
            ]
          };
          fs.writeFileSync('/tmp/atlas-sovereign-ci-report.json', JSON.stringify(payload));
          NODE

      - name: Mint GitHub OIDC report token
        if: always()
        id: oidc
        run: |
          response="$(curl --fail --silent --show-error             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=atlas-sovereign-ci")"
          token="$(node -e "const d=JSON.parse(process.argv[1]); if(!d.value) process.exit(2); process.stdout.write(d.value)" "$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Report to ATLAS execution evidence
        if: always()
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          ATLAS_EXECUTION_URL: https://ggmanzcgtlrvqfoccgsh.supabase.co/functions/v1/atlas-sovereign-ci-report
        run: |
          curl --fail --silent --show-error             -X POST "$ATLAS_EXECUTION_URL"             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Content-Type: application/json"             --data-binary @/tmp/atlas-sovereign-ci-report.json

      - name: Enforce green gate
        if: always()
        env:
          INSTALL_EXIT: ${{ steps.install.outputs.exit_code }}
          TYPECHECK_EXIT: ${{ steps.typecheck.outputs.exit_code }}
          TEST_EXIT: ${{ steps.tests.outputs.exit_code }}
          BUILD_EXIT: ${{ steps.build.outputs.exit_code }}
        run: |
          test "$INSTALL_EXIT" = "0"
          test "$TYPECHECK_EXIT" = "0"
          test "$TEST_EXIT" = "0"
          test "$BUILD_EXIT" = "0"
