name: ATLAS Render Free AI Verify

on:
  workflow_call:
    outputs:
      verified:
        description: Whether ATLAS Local passed the protected zero-cost runtime attestation.
        value: ${{ jobs.verify.outputs.verified }}
      attested_sha:
        description: Git SHA attested by the ATLAS Local runtime check.
        value: ${{ jobs.verify.outputs.attested_sha }}
  workflow_dispatch:

# Exact-SHA production invariant: this workflow is called by the universal
# production verifier, so every deployment verification re-attests ATLAS Local.
# Manual dispatch remains available for isolated diagnostics.

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      verified: ${{ steps.verify_runtime.outputs.verified }}
      attested_sha: ${{ steps.verify_runtime.outputs.attested_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify real zero-cost inference
        id: verify_runtime
        env:
          BOOTSTRAP_URL: https://ggmanzcgtlrvqfoccgsh.supabase.co/functions/v1/atlas-local-ai-bootstrap
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl --silent --show-error --fail             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=atlas-local-ai-bootstrap")"
          OIDC_TOKEN="$(node -e 'const j=JSON.parse(process.argv[1]);process.stdout.write(String(j.value||""))' "$OIDC_JSON")"
          test -n "$OIDC_TOKEN"
          echo "::add-mask::$OIDC_TOKEN"

          VERIFIED=false
          for attempt in $(seq 1 15); do
            OUT="$RUNNER_TEMP/atlas-render-local-ai-verify.json"
            CODE="$(curl --silent --show-error               --output "$OUT"               --write-out '%{http_code}'               --request POST               -H "Authorization: Bearer $OIDC_TOKEN"               -H 'Content-Type: application/json'               "$BOOTSTRAP_URL?api=verify" || true)"
            RESULT="$(node -e 'const fs=require("fs");let j={};try{j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"))}catch{};process.stdout.write(String(j.ok===true&&j.state==="verified"&&j.inference_verified===true&&j.diarization_verified===true&&j.automatic_api_cost_usd===0))' "$OUT")"
            if [ "$CODE" = "200" ] && [ "$RESULT" = "true" ]; then
              VERIFIED=true
              break
            fi
            echo "ATLAS Render local AI not verified yet (attempt $attempt/15, HTTP $CODE)."
            sleep 30
          done

          rm -f "$RUNNER_TEMP/atlas-render-local-ai-verify.json"
          test "$VERIFIED" = "true" || { echo "::error::ATLAS Render local inference did not verify"; exit 1; }
          echo "verified=true" >> "$GITHUB_OUTPUT"
          echo "attested_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "ATLAS Local produced a real protected inference and verified the authenticated zero-cost diarization runtime with automatic model API cost USD 0 for $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
