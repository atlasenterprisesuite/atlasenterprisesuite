name: ATLAS Render Free AI Verify

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "apps/atlas-orchestrator/**"
      - "packages/atlas-mcp/**"
      - "packages/ai-core/**"
      - "scripts/install-render-local-ai.mjs"
      - "scripts/start-atlas-orchestrator.mjs"
      - "supabase/functions/atlas-local-ai-bootstrap/**"
      - "supabase/functions/atlas-copilot/**"
      - "supabase/migrations/20260919034000_atlas_render_free_local_ai.sql"
      - ".github/workflows/atlas-render-local-ai-verify.yml"
      - "package.json"

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Verify real zero-cost inference
        env:
          BOOTSTRAP_URL: https://ggmanzcgtlrvqfoccgsh.supabase.co/functions/v1/atlas-local-ai-bootstrap
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl --silent --show-error --fail             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=atlas-local-ai-bootstrap")"
          OIDC_TOKEN="$(node -e 'const j=JSON.parse(process.argv[1]);process.stdout.write(String(j.value||""))' "$OIDC_JSON")"
          test -n "$OIDC_TOKEN"
          echo "::add-mask::$OIDC_TOKEN"

          VERIFIED=false
          for attempt in $(seq 1 15); do
            OUT="$RUNNER_TEMP/atlas-render-local-ai-verify.json"
            CODE="$(curl --silent --show-error               --output "$OUT"               --write-out '%{http_code}'               --request POST               -H "Authorization: Bearer $OIDC_TOKEN"               -H 'Content-Type: application/json'               "$BOOTSTRAP_URL?api=verify" || true)"
            RESULT="$(node -e 'const fs=require("fs");let j={};try{j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"))}catch{};process.stdout.write(String(j.ok===true&&j.state==="verified"&&j.inference_verified===true&&j.automatic_api_cost_usd===0))' "$OUT")"
            if [ "$CODE" = "200" ] && [ "$RESULT" = "true" ]; then
              VERIFIED=true
              break
            fi
            echo "ATLAS Render local AI not verified yet (attempt $attempt/15, HTTP $CODE)."
            sleep 30
          done

          rm -f "$RUNNER_TEMP/atlas-render-local-ai-verify.json"
          test "$VERIFIED" = "true" || { echo "::error::ATLAS Render local inference did not verify"; exit 1; }
          echo "ATLAS Local produced a real protected inference with automatic model API cost USD 0." >> "$GITHUB_STEP_SUMMARY"
