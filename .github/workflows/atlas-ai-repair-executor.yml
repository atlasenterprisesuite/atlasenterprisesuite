name: ATLAS AI Repair Executor

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: atlas-ai-repair-executor
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  repair:
    name: Claim, repair, validate, and open PR
    if: github.repository == 'atlasenterprisesuite/atlasenterprisesuite'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run bounded ATLAS repair executor
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATLAS_REPAIR_OIDC_AUDIENCE: atlas-enterprise-suite-repair
        run: node scripts/atlas-ai-repair-runner.mjs
