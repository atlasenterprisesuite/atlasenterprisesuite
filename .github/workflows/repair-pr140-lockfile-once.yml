name: Repair PR 140 lockfile once

on:
  push:
    branches:
      - feat/personal-voice-domain-governance
    paths:
      - .github/workflows/repair-pr140-lockfile-once.yml

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/personal-voice-domain-governance
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate package-lock for workspaces
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify consensus commands
        run: |
          npm ci
          npm run test:integration
          npm run typecheck
          npm run build
          npm ci --audit --audit-level=high
          npm run test:unit

      - name: Commit lockfile repair
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "atlas-ci-lockfile-repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: synchronize workspace lockfile"
          git push origin HEAD:feat/personal-voice-domain-governance
