name: ATLAS Audit Lockfile Repair

on:
  push:
    branches:
      - audit/atlas-production-runner-closure-2026-09-13
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-audit-lockfile-repair
  cancel-in-progress: false

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/atlas-production-runner-closure-2026-09-13
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile deterministically
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile only when npm changed it
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi

          changed="$(git diff --name-only)"
          if [ "$changed" != "package-lock.json" ]; then
            echo "Unexpected files changed while regenerating lockfile:"
            printf '%s\n' "$changed"
            exit 1
          fi

          git config user.name "atlas-audit-bot"
          git config user.email "atlashealthfrontiers@gmail.com"
          git add package-lock.json
          git commit -m "fix(ci): sync npm workspace lockfile"
          git push origin HEAD:audit/atlas-production-runner-closure-2026-09-13
