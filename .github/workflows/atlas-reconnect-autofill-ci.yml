name: ATLAS Reconnect Autofill CI

on:
  push:
    branches: ["feat/reconnect-autofill"]
  pull_request:
    branches: ["main"]
    paths:
      - 'apps/reconnect-autofill-extension/**'
      - 'tests/unit/reconnect-autofill-*.test.ts'
      - 'tests/integration/reconnect-autofill-flow.test.ts'
      - 'tests/fixtures/reconnect/**'
      - 'docs/superpowers/specs/2026-10-05-atlas-reconnect-autofill-design.md'
      - 'docs/superpowers/plans/2026-10-05-atlas-reconnect-autofill.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/atlas-reconnect-autofill-ci.yml'

permissions:
  contents: read

jobs:
  reconnect-tdd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reconnect TDD contract
        run: npx vitest run tests/unit/reconnect-autofill-validation.test.ts
