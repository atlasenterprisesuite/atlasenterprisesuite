name: Accounts Payable CI

on:
  push:
    branches: ["feat/accounts-payable"]
  pull_request:
    branches: ["main"]
    paths:
      - "apps/web/src/modules/finance/accounting/**"
      - "packages/accounting/**"
      - "data/demo/accounting/**"
      - "tests/unit/accounting-*.test.ts"
      - "tests/integration/payables-route.test.tsx"
      - ".github/workflows/accounts-payable-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Runtime
        run: |
          node --version
          npm --version
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
