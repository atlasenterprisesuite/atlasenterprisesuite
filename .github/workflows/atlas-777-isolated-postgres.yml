name: ATLAS 777 Isolated PostgreSQL 17 Runtime
on:
  push:
    branches:
      - audit/supabase-definer-rls-777-20261101
    paths:
      - '.github/workflows/atlas-777-isolated-postgres.yml'
      - 'tests/security/**'
  pull_request:
    paths:
      - '.github/workflows/atlas-777-isolated-postgres.yml'
      - 'tests/security/**'
      - 'tests/integration/supabase-privileged-rpc-static-777.test.ts'
      - 'supabase/migrations/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: atlas_test
          POSTGRES_PASSWORD: isolated_fixture_only
          POSTGRES_DB: atlas_777_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas_test -d atlas_777_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: atlas_test
      PGPASSWORD: isolated_fixture_only
      PGDATABASE: atlas_777_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify isolated PostgreSQL 17 and tenant fixtures
        run: |
          set -euo pipefail
          version="$(psql -X -Atqc 'show server_version_num')"
          [[ "$version" =~ ^[0-9]+$ ]] || { echo 'POSTGRES_VERSION_QUERY_FAILED'; exit 1; }
          test "$version" -ge 170000
          isolation="$(psql -X -Atqc 'show transaction_isolation')"
          test "$isolation" = 'read committed' || { echo "UNEXPECTED_ISOLATION: $isolation"; exit 1; }
          echo "POSTGRES_17_ENGINE_READY SHA=${GITHUB_SHA} isolation=${isolation}"
          psql -v ON_ERROR_STOP=1 -f tests/security/atlas-777-postgres-smoke.sql
      - name: Check prerequisites for original People migration (fail closed)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/security/atlas-777-people-real-dependencies.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923201500_atlas_people_core.sql
      - name: Explicitly reject premature RPC certification
        run: |
          echo 'ENGINE_SMOKE_ONLY: real 22 RPC migration/authorization/revocation certification not yet executed'
          echo 'ATLAS 777 P0 NO-GO: required RPC certification evidence missing'
          exit 1
