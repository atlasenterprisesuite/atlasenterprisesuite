name: ATLAS Automations CI

on:
  push:
    branches:
      - release/atlas-a-z
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - name: Automation domain guardrails
        run: npm test -- tests/unit/automations-core.test.ts
      - name: Reject executable runtime primitives
        run: |
          if grep -R -nE "from ['\"](node:)?(child_process|vm|worker_threads)['\"]|\beval\(|new Function\(" packages/automations/src 2>/dev/null; then
            echo "Executable runtime primitive detected in Automations core"
            exit 1
          fi
      - run: npm run build
