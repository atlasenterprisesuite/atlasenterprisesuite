name: ATLAS Transform Engine Authenticated E2E
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/modules/creator/director/MotionDesigner.tsx'
      - 'apps/web/src/modules/creator/director/motion/**'
      - 'scripts/e2e/atlas-transform-engine-axe.mjs'
      - 'tests/integration/atlas-transform-engine-preview.test.tsx'
      - 'tests/unit/atlas-transform-engine-preview.test.ts'
      - '.github/workflows/atlas-transform-engine-auth-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-identity-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate browser script syntax and focused tests
        run: |
          node --check scripts/e2e/atlas-transform-engine-axe.mjs
          npx vitest run tests/unit/atlas-transform-engine-preview.test.ts tests/integration/atlas-transform-engine-preview.test.tsx
      - name: Typecheck
        run: npm run typecheck
      - name: Build isolated preview with no production services
        env:
          VITE_SUPABASE_URL: https://atlas-transform-e2e.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: isolated-transform-browser-key
          VITE_ATLAS_TRANSFORM_PREVIEW: isolated-e2e-only
        run: npm run build
      - name: Test authenticated real browser and Axe on Transform Engine
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.64.1 axe-core@4.14.0
          npx playwright install --with-deps chromium
          (cd apps/web && npx vite preview --host 127.0.0.1 --port 4173 --strictPort) > /tmp/atlas-transform-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --noproxy '*' -fsS http://127.0.0.1:4173/ > /dev/null; then
              node scripts/e2e/atlas-transform-engine-axe.mjs
              exit 0
            fi
            sleep 1
          done
          cat /tmp/atlas-transform-preview.log
          exit 1
      - name: Capture local browser preview logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-transform-isolated-browser-logs
          path: /tmp/atlas-transform-preview.log
          if-no-files-found: ignore
