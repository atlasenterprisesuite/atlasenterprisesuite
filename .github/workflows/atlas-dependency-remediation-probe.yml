name: ATLAS Dependency Remediation Probe

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-dependency-remediation-${{ github.sha }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build ATLAS-secured picomatch candidate from reviewed exact SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .atlas-probe
          git clone --no-checkout --filter=blob:none https://github.com/rborlone/picomatch.git .atlas-probe/picomatch-source
          git -C .atlas-probe/picomatch-source fetch --depth=1 origin 44f192261f312ddf236cb7bdc05d8f22663f98f9
          git -C .atlas-probe/picomatch-source checkout --detach 44f192261f312ddf236cb7bdc05d8f22663f98f9
          test "$(git -C .atlas-probe/picomatch-source rev-parse HEAD)" = "44f192261f312ddf236cb7bdc05d8f22663f98f9"

          node - <<'NODE'
          const fs = require('fs');
          const path = '.atlas-probe/picomatch-source/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.name = '@atlas/picomatch-secure';
          pkg.version = '4.0.8-atlas.1';
          pkg.private = true;
          pkg.repository = {
            type: 'git',
            url: 'https://github.com/atlasenterprisesuite/atlasenterprisesuite.git'
          };
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE

          (
            cd .atlas-probe/picomatch-source
            npm pack --ignore-scripts --pack-destination ..
          )
          TARBALL="$(find .atlas-probe -maxdepth 1 -name 'atlas-picomatch-secure-*.tgz' -print -quit)"
          test -n "$TARBALL"
          mv "$TARBALL" .atlas-probe/atlas-picomatch-secure.tgz
          sha256sum .atlas-probe/atlas-picomatch-secure.tgz | tee .atlas-probe/atlas-picomatch-secure.sha256

      - name: Generate local-package override candidate
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.overrides = {
            ...(pkg.overrides || {}),
            picomatch: 'file:.atlas-probe/atlas-picomatch-secure.tgz'
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts

      - name: Install candidate locked tree
        run: npm ci

      - name: Verify ATLAS secure package identity and CVE regression
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const installed = require('./node_modules/picomatch/package.json');
          if (installed.name !== '@atlas/picomatch-secure') {
            console.error('Unexpected installed package identity:', installed.name);
            process.exit(1);
          }
          if (installed.version !== '4.0.8-atlas.1') {
            console.error('Unexpected installed package version:', installed.version);
            process.exit(1);
          }
          const picomatch = require('picomatch');
          const source = picomatch.makeRe('+(*a)').source;
          if (source !== '^(?:\\+\\(\\*a\\))$') {
            console.error('Unexpected +(*a) regex:', source);
            process.exit(1);
          }
          for (const pattern of ['+(*a)', '*(*a)']) {
            const start = performance.now();
            const matched = picomatch.isMatch('a'.repeat(80) + '!', pattern);
            const elapsed = performance.now() - start;
            if (matched || elapsed > 250) {
              console.error('CVE regression failure:', pattern, { matched, elapsed });
              process.exit(1);
            }
          }
          console.log('ATLAS secure picomatch CVE regression passed.');
          NODE

      - name: Require clean high-severity audit
        run: npm audit --audit-level=high

      - name: Install native verification dependencies
        run: |
          set -euo pipefail
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q "packages.microsoft.com" "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak fonts-dejavu-core

      - name: Verify complete repository against candidate
        run: npm run verify:all

      - name: Record candidate dependency tree
        if: always()
        run: npm ls picomatch fdir tinyglobby vite vitest || true

      - name: Record generated package diff
        if: always()
        run: |
          git diff -- package.json package-lock.json > dependency-remediation.diff || true
          echo "### ATLAS internal picomatch remediation diff" >> "$GITHUB_STEP_SUMMARY"
          if [ -s dependency-remediation.diff ]; then
            sed -n '1,300p' dependency-remediation.diff >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No package manifest or lockfile changes were generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-dependency-remediation-candidate-${{ github.sha }}
          path: |
            package.json
            package-lock.json
            dependency-remediation.diff
            .atlas-probe/atlas-picomatch-secure.tgz
            .atlas-probe/atlas-picomatch-secure.sha256
          if-no-files-found: error
          retention-days: 3
