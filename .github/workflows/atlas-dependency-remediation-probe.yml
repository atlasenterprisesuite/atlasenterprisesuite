name: ATLAS Dependency Remediation Probe

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-dependency-remediation-${{ github.sha }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install native verification dependencies
        run: |
          set -euo pipefail
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q "packages.microsoft.com" "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak fonts-dejavu-core

      - name: Install current locked tree
        run: npm ci

      - name: Record vulnerable tree before remediation
        run: |
          npm ls picomatch fdir tinyglobby vite vitest || true
          npm audit --audit-level=high || true

      - name: Generate exact-SHA picomatch remediation candidate
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.overrides = {
            ...(pkg.overrides || {}),
            picomatch: 'github:rborlone/picomatch#44f192261f312ddf236cb7bdc05d8f22663f98f9'
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts

      - name: Install candidate locked tree
        run: npm ci

      - name: Verify CVE-2026-112366 regression behavior
        run: |
          node - <<'NODE'
          const picomatch = require('picomatch');
          const source = picomatch.makeRe('+(*a)').source;
          if (source !== '^(?:\\+\\(\\*a\\))$') {
            console.error('Unexpected +(*a) regex:', source);
            process.exit(1);
          }
          for (const pattern of ['+(*a)', '*(*a)']) {
            const start = performance.now();
            const matched = picomatch.isMatch('a'.repeat(80) + '!', pattern);
            const elapsed = performance.now() - start;
            if (matched) {
              console.error('Risky pattern unexpectedly matched:', pattern);
              process.exit(1);
            }
            if (elapsed > 250) {
              console.error('Risky pattern exceeded bounded runtime:', pattern, elapsed);
              process.exit(1);
            }
          }
          console.log('CVE-2026-112366 regression probe passed.');
          NODE

      - name: Require clean high-severity audit
        run: npm audit --audit-level=high

      - name: Verify complete repository against candidate
        run: npm run verify:all

      - name: Record candidate dependency tree
        if: always()
        run: npm ls picomatch fdir tinyglobby vite vitest || true

      - name: Record generated package diff
        if: always()
        run: |
          git diff -- package.json package-lock.json > dependency-remediation.diff || true
          echo "### exact-SHA picomatch remediation diff" >> "$GITHUB_STEP_SUMMARY"
          if [ -s dependency-remediation.diff ]; then
            sed -n '1,280p' dependency-remediation.diff >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No package manifest or lockfile changes were generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-dependency-remediation-candidate-${{ github.sha }}
          path: |
            package.json
            package-lock.json
            dependency-remediation.diff
          if-no-files-found: error
          retention-days: 3
