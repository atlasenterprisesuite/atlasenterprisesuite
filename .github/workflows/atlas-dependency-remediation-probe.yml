name: ATLAS Dependency Remediation Probe

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-dependency-remediation-${{ github.sha }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build ATLAS Picomatch Secure from official exact SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .atlas-probe/source vendor
          git clone --no-checkout --filter=blob:none https://github.com/micromatch/picomatch.git .atlas-probe/source/picomatch
          git -C .atlas-probe/source/picomatch fetch --depth=1 origin 44f192261f312ddf236cb7bdc05d8f22663f98f9
          git -C .atlas-probe/source/picomatch checkout --detach 44f192261f312ddf236cb7bdc05d8f22663f98f9
          test "$(git -C .atlas-probe/source/picomatch rev-parse HEAD)" = "44f192261f312ddf236cb7bdc05d8f22663f98f9"
          test "$(git -C .atlas-probe/source/picomatch remote get-url origin)" = "https://github.com/micromatch/picomatch.git"

          node - <<'NODE'
          const fs = require('fs');
          const path = '.atlas-probe/source/picomatch/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.name = '@atlas/picomatch-secure';
          pkg.version = '4.0.8-atlas.1';
          pkg.private = true;
          pkg.repository = {
            type: 'git',
            url: 'https://github.com/micromatch/picomatch.git',
            directory: '.'
          };
          pkg.atlasProvenance = {
            upstream: 'https://github.com/micromatch/picomatch',
            upstreamCommit: '44f192261f312ddf236cb7bdc05d8f22663f98f9',
            securityFix: 'CVE-2026-112366'
          };
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE

          (
            cd .atlas-probe/source/picomatch
            npm pack --ignore-scripts --pack-destination ../../../vendor
          )
          TARBALL="$(find vendor -maxdepth 1 -name 'atlas-picomatch-secure-*.tgz' -print -quit)"
          test -n "$TARBALL"
          mv "$TARBALL" vendor/atlas-picomatch-secure.tgz
          tar -tzf vendor/atlas-picomatch-secure.tgz | grep -Fx 'package/LICENSE'
          tar -tzf vendor/atlas-picomatch-secure.tgz | grep -Fx 'package/lib/parse.js'
          SHA256="$(sha256sum vendor/atlas-picomatch-secure.tgz | awk '{print $1}')"
          printf '%s  %s\n' "$SHA256" 'vendor/atlas-picomatch-secure.tgz' > vendor/atlas-picomatch-secure.sha256
          node - "$SHA256" <<'NODE'
          const fs = require('fs');
          const sha256 = process.argv[2];
          const provenance = {
            name: '@atlas/picomatch-secure',
            version: '4.0.8-atlas.1',
            license: 'MIT',
            upstream: 'https://github.com/micromatch/picomatch',
            upstreamCommit: '44f192261f312ddf236cb7bdc05d8f22663f98f9',
            securityIssue: 'CVE-2026-112366 / GHSA-fc5q-39xc-vjpf',
            patchScope: ['lib/parse.js', 'test/options.maxExtglobRecursion.js'],
            tarballSha256: sha256
          };
          fs.writeFileSync(
            'vendor/atlas-picomatch-secure.PROVENANCE.json',
            JSON.stringify(provenance, null, 2) + '\n'
          );
          NODE

      - name: Generate local ATLAS override candidate
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.devDependencies = {
            ...(pkg.devDependencies || {}),
            picomatch: 'file:vendor/atlas-picomatch-secure.tgz'
          };
          pkg.overrides = {
            ...(pkg.overrides || {}),
            picomatch: '$picomatch'
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts

      - name: Install candidate locked tree
        run: npm ci

      - name: Verify ATLAS package identity, provenance and CVE regression
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check vendor/atlas-picomatch-secure.sha256
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const installed = require('./node_modules/picomatch/package.json');
          const provenance = JSON.parse(fs.readFileSync(
            'vendor/atlas-picomatch-secure.PROVENANCE.json',
            'utf8'
          ));
          if (installed.name !== '@atlas/picomatch-secure') {
            console.error('Unexpected installed package identity:', installed.name);
            process.exit(1);
          }
          if (installed.version !== '4.0.8-atlas.1') {
            console.error('Unexpected installed package version:', installed.version);
            process.exit(1);
          }
          if (provenance.upstreamCommit !== '44f192261f312ddf236cb7bdc05d8f22663f98f9') {
            console.error('Unexpected upstream commit');
            process.exit(1);
          }
          const bytes = fs.readFileSync('vendor/atlas-picomatch-secure.tgz');
          const digest = crypto.createHash('sha256').update(bytes).digest('hex');
          if (digest !== provenance.tarballSha256) {
            console.error('Tarball provenance digest mismatch');
            process.exit(1);
          }

          const picomatch = require('picomatch');
          for (const [pattern, expected] of [
            ['+(*a)', '^(?:\\+\\(\\*a\\))$'],
            ['*(*a)', '^(?:\\*\\(\\*a\\))$']
          ]) {
            const source = picomatch.makeRe(pattern).source;
            if (source !== expected) {
              console.error('Unexpected patched regex:', pattern, source);
              process.exit(1);
            }
            const start = performance.now();
            const matched = picomatch.isMatch('a'.repeat(80) + '!', pattern);
            const elapsed = performance.now() - start;
            if (matched || elapsed > 250) {
              console.error('CVE regression failure:', pattern, { matched, elapsed });
              process.exit(1);
            }
          }
          console.log('ATLAS Picomatch Secure provenance + CVE regression PASS.');
          NODE

      - name: Require clean high-severity npm audit
        run: npm audit --audit-level=high

      - name: Install native verification dependencies
        run: |
          set -euo pipefail
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q "packages.microsoft.com" "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak fonts-dejavu-core

      - name: Verify complete repository against candidate
        run: npm run verify:all

      - name: Record candidate dependency tree
        if: always()
        run: npm ls picomatch fdir tinyglobby vite vitest || true

      - name: Record generated package diff
        if: always()
        run: |
          git diff -- package.json package-lock.json > dependency-remediation.diff || true
          echo "### ATLAS Picomatch Secure remediation diff" >> "$GITHUB_STEP_SUMMARY"
          if [ -s dependency-remediation.diff ]; then
            sed -n '1,300p' dependency-remediation.diff >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No package manifest or lockfile changes were generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-dependency-remediation-candidate-${{ github.sha }}
          path: |
            package.json
            package-lock.json
            dependency-remediation.diff
            vendor/atlas-picomatch-secure.tgz
            vendor/atlas-picomatch-secure.sha256
            vendor/atlas-picomatch-secure.PROVENANCE.json
          if-no-files-found: error
          retention-days: 3
