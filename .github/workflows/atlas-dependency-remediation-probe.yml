name: ATLAS Dependency Remediation Probe

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-dependency-remediation-${{ github.sha }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Generate official-upstream exact-SHA candidate
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.overrides = {
            ...(pkg.overrides || {}),
            picomatch: 'github:micromatch/picomatch#44f192261f312ddf236cb7bdc05d8f22663f98f9'
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts

      - name: Verify exact upstream source pin
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const entry = lock.packages?.['node_modules/picomatch'];
          const resolved = String(entry?.resolved || '');
          const sha = '44f192261f312ddf236cb7bdc05d8f22663f98f9';
          if (!resolved.includes('micromatch/picomatch') || !resolved.includes(sha)) {
            console.error('Unexpected picomatch resolution:', resolved);
            process.exit(1);
          }
          console.log('Official upstream exact-SHA pin verified:', resolved);
          NODE

      - name: Install candidate locked tree
        run: npm ci

      - name: Verify official patch identity and CVE regression
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const installed = require('./node_modules/picomatch/package.json');
          if (installed.name !== 'picomatch') {
            console.error('Unexpected installed package identity:', installed.name);
            process.exit(1);
          }
          const picomatch = require('picomatch');
          const source = picomatch.makeRe('+(*a)').source;
          if (source !== '^(?:\\+\\(\\*a\\))$') {
            console.error('Unexpected +(*a) regex:', source);
            process.exit(1);
          }
          for (const pattern of ['+(*a)', '*(*a)']) {
            const start = performance.now();
            const matched = picomatch.isMatch('a'.repeat(80) + '!', pattern);
            const elapsed = performance.now() - start;
            if (matched || elapsed > 250) {
              console.error('CVE regression failure:', pattern, { matched, elapsed });
              process.exit(1);
            }
          }
          console.log('Official upstream picomatch CVE regression passed.');
          NODE

      - name: Require clean high-severity audit
        run: npm audit --audit-level=high

      - name: Install native verification dependencies
        run: |
          set -euo pipefail
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q "packages.microsoft.com" "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak fonts-dejavu-core

      - name: Verify complete repository against candidate
        run: npm run verify:all

      - name: Record candidate dependency tree
        if: always()
        run: npm ls picomatch fdir tinyglobby vite vitest || true

      - name: Record generated package diff
        if: always()
        run: |
          git diff -- package.json package-lock.json > dependency-remediation.diff || true
          echo "### official-upstream exact-SHA picomatch remediation diff" >> "$GITHUB_STEP_SUMMARY"
          if [ -s dependency-remediation.diff ]; then
            sed -n '1,300p' dependency-remediation.diff >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No package manifest or lockfile changes were generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-dependency-remediation-candidate-${{ github.sha }}
          path: |
            package.json
            package-lock.json
            dependency-remediation.diff
          if-no-files-found: error
          retention-days: 3
