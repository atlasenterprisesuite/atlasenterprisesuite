name: ATLAS Vendored Dependency Integrity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify vendored ATLAS package checksum
        run: sha256sum --check vendor/atlas-picomatch-secure.sha256

      - name: Install locked dependency tree
        run: npm ci

      - name: Require clean high-severity npm audit
        run: npm audit --audit-level=high

      - name: Verify ATLAS Picomatch Secure regression boundary
        run: npx --no-install vitest run tests/unit/atlas-picomatch-security.test.ts
