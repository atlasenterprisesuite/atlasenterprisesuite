name: ATLAS Dependency Remediation Probe

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-dependency-remediation-${{ github.sha }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install native verification dependencies
        run: |
          set -euo pipefail
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q "packages.microsoft.com" "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak fonts-dejavu-core

      - name: Install current locked tree
        run: npm ci

      - name: Record vulnerable tree before remediation
        run: |
          npm ls picomatch fdir tinyglobby vite vitest || true
          npm audit --audit-level=high || true

      - name: Generate targeted remediation candidate
        run: |
          set -euo pipefail
          npm install             --save-dev             --save-exact             --package-lock-only             --ignore-scripts             vite@5.4.21             vitest@2.1.9

      - name: Reject residual picomatch dependency
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const entry = lock.packages?.['node_modules/picomatch'];
          if (entry) {
            console.error(`Residual picomatch dependency detected: ${entry.version || 'unknown'}`);
            process.exit(1);
          }
          console.log('No picomatch package remains in the candidate lockfile.');
          NODE

      - name: Install candidate locked tree
        run: npm ci

      - name: Require clean high-severity audit
        run: npm audit --audit-level=high

      - name: Verify complete repository against candidate
        run: npm run verify:all

      - name: Record candidate dependency tree
        if: always()
        run: npm ls picomatch fdir tinyglobby vite vitest || true

      - name: Record generated package diff
        if: always()
        run: |
          git diff -- package.json package-lock.json > dependency-remediation.diff || true
          echo "### targeted dependency remediation diff" >> "$GITHUB_STEP_SUMMARY"
          if [ -s dependency-remediation.diff ]; then
            sed -n '1,260p' dependency-remediation.diff >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No package manifest or lockfile changes were generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-dependency-remediation-candidate-${{ github.sha }}
          path: |
            package.json
            package-lock.json
            dependency-remediation.diff
          if-no-files-found: error
          retention-days: 3
