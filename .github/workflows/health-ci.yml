name: ATLAS Health Verification

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/atlas-health-disease-reconstruction-lab

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Source safety verification
        run: npm run verify:source

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build
