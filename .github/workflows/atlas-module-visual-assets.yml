name: ATLAS Module Visual Assets

on:
  push:
    branches:
      - spec/atlas-module-visual-collection
    paths:
      - scripts/generate-atlas-module-visual-assets.py
      - scripts/verify-module-visuals.mjs
      - scripts/verify-atlas-design.mjs
      - apps/web/src/modules/integration/moduleVisuals.ts
      - .github/workflows/atlas-module-visual-assets.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-module-visual-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout visual branch
        uses: actions/checkout@v4
        with:
          ref: spec/atlas-module-visual-collection
          fetch-depth: 0

      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic visual runtime
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir pillow==11.3.0
          python - <<'PY'
          from PIL import features
          assert features.check('webp'), 'Pillow WebP support missing'
          assert features.check('avif'), 'Pillow AVIF support missing'
          print('Pillow WebP/AVIF runtime ready')
          PY

      - name: Generate ATLAS visual collection
        run: python scripts/generate-atlas-module-visual-assets.py

      - name: Verify image quality gate
        run: node scripts/verify-module-visuals.mjs

      - name: Verify design gate
        run: npm run verify:design

      - name: Record visual QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: atlas-module-visual-qa
          path: artifacts/visual-qa/atlas-module-visual-contact-sheet.jpg
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated visual assets
        id: commit
        shell: bash
        run: |
          git config user.name 'ATLAS Visual Bot'
          git config user.email 'atlas-visual-bot@users.noreply.github.com'
          git add apps/web/public/atlas/visuals/modules
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Visual assets already deterministic and current.'
            exit 0
          fi
          git commit -m 'feat(visuals): generate ATLAS module cover collection'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Push generated assets
        if: steps.commit.outputs.changed == 'true'
        run: git push origin HEAD:spec/atlas-module-visual-collection
