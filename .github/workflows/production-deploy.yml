name: ATLAS Production Deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "data/**"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - ".github/workflows/production-deploy.yml"

concurrency:
  group: atlas-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_SCOPE: winderaranguren-gifs-projects
      VERCEL_PROJECT_NAME: atlasenterprisesuite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Security gate
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Production build
        run: npm run build

      - name: Validate Vercel authorization
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error title=ATLAS production deploy blocked::Repository secret VERCEL_TOKEN is not configured."
            echo "Build and tests passed, but deployment was not attempted because Vercel authorization is missing." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Ensure Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if vercel project inspect "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > /dev/null 2>&1; then
            echo "Vercel project $VERCEL_SCOPE/$VERCEL_PROJECT_NAME already exists." >> "$GITHUB_STEP_SUMMARY"
          else
            curl --fail-with-body --silent --show-error \
              --request POST \
              --url "https://api.vercel.com/v11/projects?slug=$VERCEL_SCOPE" \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              --header "Content-Type: application/json" \
              --data "{\"name\":\"$VERCEL_PROJECT_NAME\",\"framework\":\"vite\",\"installCommand\":\"npm ci\",\"buildCommand\":\"npm run build\",\"outputDirectory\":\"apps/web/dist\"}" \
              > /tmp/atlas-vercel-project.json
            vercel project inspect "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > /dev/null
            echo "Created and verified Vercel project $VERCEL_SCOPE/$VERCEL_PROJECT_NAME." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          DEPLOYMENT_URL="$(vercel deploy . --prod --yes --scope "$VERCEL_SCOPE" --project "$VERCEL_PROJECT_NAME" --token "$VERCEL_TOKEN")"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "ATLAS deployment URL: $DEPLOYMENT_URL"

      - name: Verify production routes
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 3 --fail --silent --show-error "$DEPLOYMENT_URL/" > /dev/null
          curl --retry 5 --retry-delay 3 --fail --silent --show-error "$DEPLOYMENT_URL/finance/accounting/accounts-payable" > /dev/null
          HEALTH="$(curl --retry 5 --retry-delay 3 --fail --silent --show-error "$DEPLOYMENT_URL/healthz")"
          echo "$HEALTH" | grep -q '"status": "ok"'
          INFRA_STATUS_CODE="$(curl --retry 5 --retry-delay 3 --silent --show-error --output /tmp/atlas-infra-status.json --write-out '%{http_code}' "$DEPLOYMENT_URL/atlas/infra/status")"
          test "$INFRA_STATUS_CODE" = "401"
          echo "Production route, health, and authenticated ATLAS Manager boundary verification passed for $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
