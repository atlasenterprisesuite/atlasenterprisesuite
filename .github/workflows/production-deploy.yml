name: ATLAS Build + Production Readiness Gate

on:
  workflow_dispatch:
  # Pull requests to main must prove full repository readiness before merge.
  # Every merged main SHA must then receive fresh readiness evidence again.
  # Do not path-filter either trigger: readiness must never be inherited from
  # an older commit, regardless of which subsystem changed.
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: atlas-production-readiness
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-build-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install native media verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak fonts-dejavu-core
          ffmpeg -version
          ffprobe -version
          espeak --version
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf

      - name: Install locked dependencies
        run: npm ci

      - name: Verify complete repository
        run: npm run verify:all

      - name: Record Supabase-first readiness boundary
        run: |
          {
            echo "## ATLAS Supabase-first readiness gate"
            echo "- Canonical source validation: passed"
            echo "- Dependency security audit: passed"
            echo "- Typecheck: passed"
            echo "- Unit tests: passed"
            echo "- Integration tests: passed"
            echo "- Supabase source/migration verification: passed"
            echo "- Creator Native Python tests: passed"
            echo "- Vite production build: passed"
            echo "- Supabase ATLAS Manager: required control plane; runtime verified separately"
            echo "- Vercel: optional legacy adapter; not part of this gate"
            echo "- Cloudflare production deployment: separate required stage; not claimed by this workflow"
            echo "- Public production verification: separate required stage; not claimed by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
