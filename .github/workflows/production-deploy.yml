name: ATLAS Production Deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "data/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/production-deploy.yml"

concurrency:
  group: atlas-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_PROJECT_REF: qawxltbplsxcjvwxdkes
      PRODUCTION_URL: https://www.atlasenterprisesuite.com
      APEX_URL: https://atlasenterprisesuite.com
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}

    steps:
      - name: Checkout canonical commit
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            VITE_SUPABASE_URL
            VITE_SUPABASE_PUBLISHABLE_KEY
            SUPABASE_SERVICE_ROLE_KEY
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_PAGES_PROJECT
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=ATLAS production deploy blocked::Required secret/config $name is not configured."
              exit 1
            fi
          done

          expected="https://${SUPABASE_PROJECT_REF}.supabase.co"
          if [ "$VITE_SUPABASE_URL" != "$expected" ]; then
            echo "::error title=ATLAS Supabase target mismatch::VITE_SUPABASE_URL does not resolve to canonical atlas-core-v2 project ref ${SUPABASE_PROJECT_REF}."
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Security gate
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Production build
        run: npm run build

      - name: Verify canonical Supabase backend gate
        shell: bash
        run: |
          set -euo pipefail
          GATE_JSON="$(curl --retry 3 --retry-delay 2 --fail --silent --show-error \
            --request POST \
            --url "$VITE_SUPABASE_URL/rest/v1/rpc/atlas_backend_gate" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data '{}')"

          GATE_JSON="$GATE_JSON" node <<'NODE'
          const rows = JSON.parse(process.env.GATE_JSON || '[]');
          if (!Array.isArray(rows) || rows.length < 6) {
            throw new Error('ATLAS Backend Gate returned an incomplete result set');
          }
          const total = rows.reduce((sum, row) => sum + Number(row.total_checks || 0), 0);
          const passed = rows.reduce((sum, row) => sum + Number(row.passed_checks || 0), 0);
          const failed = rows.reduce((sum, row) => sum + Number(row.failed_checks || 0), 0);
          if (failed !== 0 || passed !== total || total < 58) {
            throw new Error(`ATLAS Backend Gate failed: total=${total} passed=${passed} failed=${failed}`);
          }
          console.log(`ATLAS Backend Gate passed: ${passed}/${total}`);
          NODE

          echo "Supabase v2 Backend Gate passed for ${SUPABASE_PROJECT_REF}." >> "$GITHUB_STEP_SUMMARY"
          echo "Database migrations are intentionally not auto-pushed here until the complete v2 migration history is mirrored in the canonical repository." >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy verified web artifact to Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy apps/web/dist \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch=main \
            --commit-hash="$GITHUB_SHA"

      - name: Verify public production routes
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 8 --retry-delay 5 --retry-all-errors --fail --silent --show-error "$APEX_URL/" > /dev/null
          curl --retry 8 --retry-delay 5 --retry-all-errors --fail --silent --show-error "$PRODUCTION_URL/" > /dev/null
          curl --retry 8 --retry-delay 5 --retry-all-errors --fail --silent --show-error "$PRODUCTION_URL/finance/accounting/accounts-payable" > /dev/null
          HEALTH="$(curl --retry 8 --retry-delay 5 --retry-all-errors --fail --silent --show-error "$PRODUCTION_URL/healthz")"
          echo "$HEALTH" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'
          echo "Cloudflare production route and health verification passed for commit $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
