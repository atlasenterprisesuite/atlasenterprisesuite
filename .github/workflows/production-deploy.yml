name: ATLAS Build + Production Readiness Gate

on:
  workflow_dispatch:
  # Pull requests to main must prove full repository readiness before merge.
  # Every merged main SHA must then receive fresh readiness evidence again.
  # Do not path-filter either trigger: readiness must never be inherited from
  # an older commit, regardless of which subsystem changed.
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  # Exact-SHA isolation prevents unrelated PR/main runs from cancelling a pending readiness proof.
  group: atlas-production-readiness-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-build-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Sentinel Shield and block P0 secrets in changed sources
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        shell: bash
        run: |
          python3 -m unittest discover -s tools/atlas-sentinel-shield -p 'test_*.py'
          bash -n tools/atlas-sentinel-shield/ci-gate.sh
          bash tools/atlas-sentinel-shield/ci-gate.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Require ATLAS Copilot version bump when source changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail

          BASE_SHA=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            BASE_SHA="$PUSH_BEFORE_SHA"
          fi

          if [ -z "$BASE_SHA" ] || printf '%s' "$BASE_SHA" | grep -Eq '^0+$'; then
            echo "ATLAS Copilot version gate skipped: no comparable base SHA."
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASE_SHA"

          if git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- supabase/functions/atlas-copilot/; then
            echo "ATLAS Copilot source unchanged; VERSION bump not required."
            exit 0
          fi

          BASE_VERSION="$(git show "$BASE_SHA:supabase/functions/atlas-copilot/index.ts" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const m=s.match(/const VERSION=(\\d+);/);if(!m)process.exit(2);process.stdout.write(m[1]);})")"
          HEAD_VERSION="$(node -e "const fs=require('fs');const s=fs.readFileSync('supabase/functions/atlas-copilot/index.ts','utf8');const m=s.match(/const VERSION=(\\d+);/);if(!m)process.exit(2);process.stdout.write(m[1]);")"

          test -n "$BASE_VERSION" || { echo "::error::Unable to read ATLAS Copilot base VERSION"; exit 1; }
          test -n "$HEAD_VERSION" || { echo "::error::Unable to read ATLAS Copilot head VERSION"; exit 1; }

          if [ "$HEAD_VERSION" -le "$BASE_VERSION" ]; then
            echo "::error::ATLAS Copilot source changed without a monotonic VERSION bump (base=$BASE_VERSION head=$HEAD_VERSION)."
            exit 1
          fi

          echo "ATLAS Copilot VERSION advanced from $BASE_VERSION to $HEAD_VERSION."

      - name: Install native media verification dependencies
        run: |
          # GitHub-hosted Ubuntu images can inherit optional third-party APT
          # sources. A 4xx from one of those sources must not prevent ATLAS
          # from installing the Ubuntu-native packages required by this gate.
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q "packages.microsoft.com" "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak fonts-dejavu-core
          ffmpeg -version
          ffprobe -version
          espeak --version
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf

      - name: Install locked dependencies
        run: npm ci

      - name: Verify complete repository
        run: npm run verify:all

      - name: Record Supabase-first readiness boundary
        run: |
          {
            echo "## ATLAS Supabase-first readiness gate"
            echo "- Canonical source validation: passed"
            echo "- Dependency security audit: passed"
            echo "- Typecheck: passed"
            echo "- Unit tests: passed"
            echo "- Integration tests: passed"
            echo "- Supabase source/migration verification: passed"
            echo "- Creator Native Python tests: passed"
            echo "- Vite production build: passed"
            echo "- Supabase ATLAS Manager: required control plane; runtime verified separately"
            echo "- Vercel: optional legacy adapter; not part of this gate"
            echo "- Cloudflare production deployment: separate required stage; not claimed by this workflow"
            echo "- Public production verification: separate required stage; not claimed by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"

  # Isolated public-data browser lab; never deploys, never uses production credentials.
  verify-earth-real-data:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/travel-consolidation-777' && github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Verify exact source and prepare isolated browser lab
        env:
          ATLAS_EARTH_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ATLAS_EARTH_SHA"
          npm install --prefix "$RUNNER_TEMP/earth-browser" --no-audit --no-fund playwright@1.51.1
          mkdir -p .tmp/earth-browser
          cat > apps/web/earth-ci.html <<'HTML'
          <!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Earth CI laboratory</title><div id="root"></div><script type="module" src="/src/earth-ci.tsx"></script></html>
          HTML
          cat > apps/web/src/earth-ci.tsx <<'TSX'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import { BrowserRouter } from 'react-router-dom';
          import { Gps4DPage } from './modules/gps/Gps4DPage';
          import './atlas-design-tokens.css';
          import './styles.css';
          import './accessibility.css';
          createRoot(document.getElementById('root')!).render(<BrowserRouter><Gps4DPage /></BrowserRouter>);
          TSX
          export ATLAS_PLAYWRIGHT_MODULE="$RUNNER_TEMP/earth-browser/node_modules/playwright/index.mjs"
          npm --workspace apps/web run dev -- --host 127.0.0.1 --port 4173 --strictPort > .tmp/earth-browser/vite.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; rm -f apps/web/earth-ci.html apps/web/src/earth-ci.tsx' EXIT
          for attempt in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:4173/earth-ci.html > /dev/null && break
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:4173/earth-ci.html > /dev/null
          node scripts/verify-earth-browser.mjs
      - name: Record isolated Earth browser evidence
        if: always()
        run: |
          if [ -f .tmp/earth-browser/verification.json ]; then
            cat .tmp/earth-browser/verification.json
            sha256sum .tmp/earth-browser/* | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No browser evidence produced" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve Earth browser evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/earth-browser
          if [ ! -f .tmp/earth-browser/verification.json ]; then
            printf '{"ok":false,"failure":"Browser report unavailable"}\n' > .tmp/earth-browser/verification.json
          fi
          (cd .tmp/earth-browser && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Upload Earth browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earth-browser-evidence-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: .tmp/earth-browser/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
